// Module: services/cloudSync.js
// خدمة المزامنة السحابية اللحظية مع فايربيز
window.CloudSyncService = {
  // الاشتراك اللحظي في المحاضرات
  subscribeLectures: function(onUpdate) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("lectures").orderBy("date", "desc").onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        onUpdate(list);
      }, function(err) {
        console.warn("Firestore lectures read fallback to local:", err);
      });
    } catch (e) {
      return function() {};
    }
  },

  // حفظ أو تعديل محاضرة سحابياً
  saveLecture: function(lecture) {
    if (!window.db) return Promise.resolve();
    var docId = lecture.id || ("lec-" + Date.now());
    var data = Object.assign({}, lecture, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return window.db.collection("lectures").doc(docId).set(data, { merge: true });
  },

  // حفظ موضع الاستماع فقط (ثانية التوقف) لتوفير الباندويث
  updatePlaybackPosition: function(lectureId, seconds) {
    if (!window.db || !lectureId) return Promise.resolve();
    return window.db.collection("lectures").doc(lectureId).set({
      lastPosition: seconds,
      lastPlayedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  },

  // الاشتراك اللحظي في الكتب
  subscribeBooks: function(onUpdate) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("books").onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        onUpdate(list);
      });
    } catch (e) {
      return function() {};
    }

  saveBook: function(book) {
    if (!window.db) return Promise.resolve();
    var docId = book.id || ("book-" + Date.now());
    return window.db.collection("books").doc(docId).set(book, { merge: true });

// Module: services/geminiService.js
// خدمة استدعاء الذكاء الاصطناعي للتلخيص والبودكاست والمساعد الدراسي
window.GeminiAIService = {
  // مفتاح تخزين السحابة
  storageKey: "counsel_ai_api_key",

  // استخراج المفتاح من فايربيز أولاً أو التخزين المحلي الآمن
  getApiKey: async function() {
    try {
      if (window.db) {
        var doc = await window.db.collection("settings").doc("ai_config").get();
        if (doc.exists && doc.data().apiKey) {
          return doc.data().apiKey.trim();
        }
      }
    } catch (e) {}
    return window.APP_UTILS.getLocal(window.GeminiAIService.storageKey, "");
  },

  // حفظ المفتاح في السحابة ومحلياً
  saveApiKey: async function(key) {
    if (window.db) {
      await window.db.collection("settings").doc("ai_config").set({
        apiKey: key.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
    window.APP_UTILS.setLocal(window.GeminiAIService.storageKey, key.trim());
  },

  // دالة الاستدعاء المباشر لنماذج جيميني مع التبديل التلقائي للنماذج المتاحة
  callGemini: async function(prompt, systemInstruction) {
    var key = await window.GeminiAIService.getApiKey();
    if (!key) {
      throw new Error("يرجى إدخال مفتاح واجهة برمجة التطبيقات في صفحة الإعدادات لحفظه سحابياً.");
    }

    var defaultInstruction = "أنت مساعد دراسي متخصص في دراسة ومناهج المشورة الإنسانية والنفسية. لغتك عربية نقية وواضحة، تقدم تحليلات عميقة وشروحات دقيقة تخدم الدارس وتساعده على الاستيعاب.";
    var instruction = systemInstruction || defaultInstruction;

    var candidateModels = [
      "gemini-2.5-flash",
      "gemini-2.0-flash",
      "gemini-1.5-flash-latest",
      "gemini-1.5-flash-8b",
      "gemini-pro"
    ];

    var body = {
      systemInstruction: {
        parts: [{ text: instruction }]
      },
      contents: [
        {
          role: "user",
          parts: [{ text: prompt }]
        }
      ],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 2048
      }
    };

    // 1. الاستعلام التلقائي من حساب المستخدم عن النماذج المتاحة والمدعومة
    var availableModels = [];
    try {
      var listResp = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key=" + key);
      if (listResp.ok) {
        var listData = await listResp.json();
        if (listData.models && Array.isArray(listData.models)) {
          availableModels = listData.models
            .filter(function(m) {
              return m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent");
            })
            .map(function(m) {
              return m.name.replace(/^models\//, "");
            });
        }
      }
    } catch (e) {}

    // ترتيب النماذج بحيث يتم تفضيل النماذج السريعة مثل 2.5 أو 2.0 أو flash أو أي نموذج متاح
    var priorityList = [
      "gemini-2.5-flash",
      "gemini-2.0-flash",
      "gemini-2.0-flash-exp",
      "gemini-1.5-flash-latest",
      "gemini-1.5-flash",
      "gemini-1.5-pro-latest",
      "gemini-1.5-pro"
    ];

    var candidateModels = [];
    // إضافة النماذج ذات الأولوية إذا كانت متاحة أو افتراضياً
    for (var p = 0; p < priorityList.length; p++) {
      if (availableModels.length === 0 || availableModels.includes(priorityList[p])) {
        candidateModels.push(priorityList[p]);
      }
    }
    // إضافة بقية النماذج المتاحة من حساب المستخدم
    for (var a = 0; a < availableModels.length; a++) {
      if (!candidateModels.includes(availableModels[a])) {
        candidateModels.push(availableModels[a]);
      }
    }
    if (candidateModels.length === 0) {
      candidateModels = ["gemini-2.0-flash", "gemini-2.5-flash", "gemini-1.5-flash-latest"];
    }

    var lastErrorMessage = "";

    for (var m = 0; m < candidateModels.length; m++) {
      var modelName = candidateModels[m];
      var url = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + key;

      try {
        var response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (response.ok) {
          var data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
            return data.candidates[0].content.parts[0].text;
          }
        } else {
          var errData = await response.json().catch(function() { return {}; });
          lastErrorMessage = (errData.error && errData.error.message) || ("فشل الاستدعاء للنموذج " + modelName);
        }
      } catch (networkErr) {
        lastErrorMessage = networkErr.message;
      }
    }

    throw new Error(lastErrorMessage || "تعذر العثور على نموذج متوافق مع هذا المفتاح");
  },

  // توليد حوار البودكاست التفاعلي بين شخصين
  generatePodcastDialogue: async function(lectureTitle, notesOrContent) {
    var prompt = "قم بإنشاء سيناريو حواري بودكاست تفاعلي ممتع بين شخصين (المحاور الأول: فادي، والمحاورة الثانية: سارة) لمناقشة وشرح موضوع: '" + lectureTitle + "'.\n" +
      "المحتوى والنقاط الأساسية:\n" + (notesOrContent || "أسس الفهم الإنساني والمشورة") + "\n\n" +
      "المطلوب: أخرج الحوار في شكل متبادل بين فادي وسارة بلغة عربية سلسلة وهادئة مناسبة للاستماع المباشر في أي وقت بأسلوب بودكاست طبيعي وإنساني بدون أي مقدمات نمطية أو روبوتية، يطرح فادي التساؤلات الواقعية وتجيب سارة بشرح أعمق وتطبيقات عملية ملموسة.";
    
    return await window.GeminiAIService.callGemini(prompt);
  },

  // توليد كبسولة مراجعة الامتحان
  generateExamSummary: async function(title, content) {
    var prompt = "استخرج كبسولة مراجعة سريعة ومركزة ليلة الامتحان للموضوع التالي: '" + title + "'.\n" +
      "المحتوى:\n" + (content || "") + "\n\n" +
      "المطلوب:\n" +
      "1. المفاهيم والتعريفات الجوهرية.\n" +
      "2. الفروق الدقيقة والمصطلحات الأساسية.\n" +
      "3. أسئلة متوقعة وأجوبتها النموذجية المختصرة.";
    
    return await window.GeminiAIService.callGemini(prompt);
  }
};

// Module: services/notificationService.js
// خدمة الإشعارات السحابية وإشعارات المتصفح
window.NotificationService = {
  // طلب تفعيل الإشعارات من المستخدم
  requestPermission: async function() {
    if (!("Notification" in window)) {
      alert("متصفحك لا يدعم الإشعارات المباشرة.");
      return false;
    }
    var permission = await Notification.requestPermission();
    if (permission === "granted") {
      new Notification("منصة دراسة المشورة", {
        body: "تم تفعيل الإشعارات بنجاح! ستصلك تنبيهات فور نزول أي محاضرة جديدة.",
        icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E🌿%3C/text%3E%3C/svg%3E"
      });
      return true;
    }
    return false;
  },

  // إرسال إشعار سحابي إلى فايربيز ليظهر لجميع الدارسين
  broadcastNewLectureNotification: async function(lecture) {
    if (!window.db) return;
    try {
      var notifData = {
        title: "🎙️ محاضرة جديدة: " + lecture.title,
        body: "ألقاها: " + lecture.speaker + " (تاريخ: " + lecture.date + ")",
        lectureId: lecture.id,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await window.db.collection("notifications").add(notifData);
    } catch (e) {
      console.warn("Could not broadcast notification:", e);
    }
  },

  // الاستماع للإشعارات الجديدة وعرضها للمستخدمين
  subscribeNotifications: function(onNewNotification) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("notifications")
        .orderBy("createdAt", "desc")
        .limit(10)
        .onSnapshot(function(snapshot) {
          var list = [];
          snapshot.forEach(function(doc) {
            list.push(Object.assign({ id: doc.id }, doc.data()));
          });
          onNewNotification(list);
        });
    } catch (e) {
      return function() {};
    }
  }
};

// Module: services/errorReportService.js
// خدمة التقاط أخطاء النظام السحابية
window.ErrorReportService = {
  lastError: null,

  initGlobalErrorHandler: function() {
    window.onerror = function(message, source, lineno, colno, error) {
      window.ErrorReportService.lastError = {
        message: message,
        source: source,
        line: lineno,
        col: colno,
        stack: error ? error.stack : "",
        time: new Date().toISOString()
      };
      console.warn("Global error captured:", window.ErrorReportService.lastError);
    };

    window.addEventListener("unhandledrejection", function(event) {
      window.ErrorReportService.lastError = {
        message: event.reason ? (event.reason.message || event.reason) : "Unhandled Promise Rejection",
        stack: event.reason && event.reason.stack ? event.reason.stack : "",
        time: new Date().toISOString()
      };
      console.warn("Unhandled promise rejection captured:", window.ErrorReportService.lastError);
    });
  },

  // إرسال تقرير الخطأ إلى فايربيز
  sendReport: async function(reportData) {
    if (!window.db) throw new Error("قاعدة البيانات غير متصلة");
    var docId = "err_" + Date.now();
    var payload = Object.assign({}, reportData, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: "open" // 'open' or 'resolved'
    });
    return window.db.collection("error_reports").doc(docId).set(payload);
  }
};

window.ErrorReportService.initGlobalErrorHandler();

// Module: utils/helpers.js
// دوال مساعدة عامة للتعامل مع التخزين المحلي، روابط جوجل درايف، وتنسيق الوقت
window.APP_UTILS = {
  // استخراج المعرف المباشر من رابط جوجل درايف
  extractDriveId: function(url) {
    if (!url) return "";
    var match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    match = url.match(/id=([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    return url.trim();
  },

  // تحويل رابط جوجل درايف إلى رابط تشغيل وتضمين مباشر
  getDrivePreviewUrl: function(driveIdOrUrl) {
    var id = window.APP_UTILS.extractDriveId(driveIdOrUrl);
    if (!id) return "";
    return "https://drive.google.com/file/d/" + id + "/preview";
  },

  // تنسيق الثواني إلى دقائق وثوانٍ
  formatDuration: function(seconds) {
    if (!seconds || isNaN(seconds)) return "00:00";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  },

  // حفظ واسترجاع من التخزين المحلي
  getLocal: function(key, defaultValue) {
    try {
      var item = localStorage.getItem(key);
      return item ? JSON.parse(item) : defaultValue;
    } catch (e) {
      return defaultValue;
    }
  },

  setLocal: function(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  }
};

// Module: utils/embedHelpers.js
// دالة استخراج وتضمين يوتيوب أو جوجل درايف
window.APP_UTILS.getMediaEmbedUrl = function(url) {
  if (!url) return "";
  // فحص يوتيوب
  var ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
  if (ytMatch && ytMatch[1]) {
    return "https://www.youtube.com/embed/" + ytMatch[1];
  }
  // فحص جوجل درايف
  var driveId = window.APP_UTILS.extractDriveId(url);
  if (driveId) {
    return "https://drive.google.com/file/d/" + driveId + "/preview";
  }
  return url;
};

// نافذة تسجيل الدخول وطلب الانضمام للمنصة
window.AuthModal = function(props) {
  var isOpen = props.isOpen;
  var onClose = props.onClose;
  var onLoginSuccess = props.onLoginSuccess;

  var [isLogin, setIsLogin] = React.useState(true);
  var [email, setEmail] = React.useState("");
  var [phone, setPhone] = React.useState("");
  var [fullName, setFullName] = React.useState("");
  var [instituteMessage, setInstituteMessage] = React.useState("");
  var [isLoading, setIsLoading] = React.useState(false);
  var [pendingNotice, setPendingNotice] = React.useState(false);
  var [errorMsg, setErrorMsg] = React.useState("");

  if (!isOpen) return null;

  var handleRegisterRequest = async function(e) {
    e.preventDefault();
    setIsLoading(true);
    setErrorMsg("");

    try {
      if (!window.db) throw new Error("قاعدة البيانات غير متصلة");

      // فحص الحساب المسؤول الافتراضي
      if (email.trim().toLowerCase().includes("admin") || email.trim().toLowerCase().includes("nader") || phone.trim() === "01275571569") {
        onLoginSuccess({
          fullName: "الأدمن المسؤول",
          email: email.trim(),
          phone: phone.trim(),
          role: "admin",
          status: "approved"
        });
        onClose();
        return;
      }

      var userDocId = "user_" + phone.trim().replace(/\D/g, "");
      var userData = {
        fullName: fullName.trim(),
        email: email.trim().toLowerCase(),
        phone: phone.trim(),
        instituteMessage: instituteMessage.trim(),
        role: "student",
        status: "pending", // قيد انتظار موافقة الأدمن
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await window.db.collection("users").doc(userDocId).set(userData, { merge: true });
      setPendingNotice(true);
    } catch (err) {
      setErrorMsg(err.message || "حدث خطأ أثناء إرسال الطلب");
    } finally {
      setIsLoading(false);
    }
  };

  var handleLogin = async function(e) {
    e.preventDefault();
    setIsLoading(true);
    setErrorMsg("");

    try {
      // فحص إذا كان حساب الأدمن
      if (email.trim().toLowerCase().includes("admin") || email.trim().toLowerCase().includes("nader") || phone.trim() === "01275571569") {
        onLoginSuccess({
          fullName: "الأدمن المسؤول",
          email: email.trim(),
          phone: phone.trim(),
          role: "admin",
          status: "approved"
        });
        onClose();
        return;
      }

      if (!window.db) throw new Error("قاعدة البيانات غير متصلة");

      // البحث عن المستخدم بالهاتف أو البريد
      var snap = await window.db.collection("users").where("email", "==", email.trim().toLowerCase()).get();
      if (snap.empty) {
        snap = await window.db.collection("users").where("phone", "==", phone.trim()).get();
      }

      if (snap.empty) {
        throw new Error("لا يوجد حساب مسجل بهذه البيانات. يرجى تقديم طلب انضمام أولاً.");
      }

      var user = snap.docs[0].data();
      if (user.status !== "approved") {
        throw new Error("طلب انضمامك قيد المراجعة لدى الأدمن. ستتمكن من الدخول فور الموافقة عليك.");
      }

      onLoginSuccess(user);
      onClose();
    } catch (err) {
      setErrorMsg(err.message);
    } finally {
      setIsLoading(false);
    }
  };

  return React.createElement(
    "div",
    { className: "fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" },
    React.createElement(
      "div",
      { className: "bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4" },

      React.createElement(
        "div",
        { className: "flex items-center justify-between border-b pb-3" },
        React.createElement("div", null,
          React.createElement("h3", { className: "text-base font-bold text-slate-900 dark:text-white" },
            isLogin ? "تسجيل الدخول للمنصة" : "طلب انضمام دارس جديد"
          ),
          React.createElement("p", { className: "text-xs text-slate-400" }, "منصة دراسة المشورة • حساب خاص بالدارسين")
        ),
        React.createElement("button", { onClick: onClose, className: "text-slate-400" }, "✕")
      ),

      errorMsg && React.createElement(
        "div",
        { className: "p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 text-xs border border-rose-200" },
        errorMsg
      ),

      pendingNotice ? React.createElement(
        "div",
        { className: "p-6 text-center space-y-3" },
        React.createElement("div", { className: "text-3xl" }, "⏳"),
        React.createElement("h4", { className: "text-sm font-bold text-slate-900 dark:text-white" }, "تم استلام طلب انضمامك بنجاح"),
        React.createElement("p", { className: "text-xs text-slate-500 leading-relaxed" },
          "الطلب الآن في انتظار مراجعة الأدمن للتأكد من بيانات الدارسين. ستتمكن من تصفح المحاضرات والمراجع فور تفعيل حسابك."
        ),
        React.createElement("button", {
          onClick: function() { setPendingNotice(false); setIsLogin(true); },
          className: "mt-2 bg-slate-900 dark:bg-emerald-600 text-white px-5 py-2 rounded-xl text-xs font-bold"
        }, "العودة لتسجيل الدخول")
      ) : isLogin ? React.createElement(
        // نموذج تسجيل الدخول
        "form",
        { onSubmit: handleLogin, className: "space-y-3" },
        React.createElement("div", null,
          React.createElement("label", { className: "block text-xs font-semibold mb-1" }, "البريد الإلكتروني"),
          React.createElement("input", {
            type: "email",
            required: true,
            value: email,
            onChange: function(e) { setEmail(e.target.value); },

        ),
        React.createElement("div", null,

          React.createElement("input", {

            placeholder: "012xxxxxxxx",
            className: "w-full px-3 py-2 rounded-xl border bg-slate-50 dark:bg-slate-800 text-xs"
          })
        ),
        React.createElement("button", {
          type: "submit",
          disabled: isLoading,
          className: "w-full py-2.5 rounded-xl bg-slate-900 dark:bg-emerald-600 text-white font-bold text-xs shadow-sm disabled:opacity-50"
        }, isLoading ? "جاري التحقق..." : "دخول إلى المنصة"),
        React.createElement("div", { className: "text-center pt-2" },
          React.createElement("button", {
            type: "button",
            onClick: function() { setIsLogin(false); setErrorMsg(""); },
            className: "text-xs text-slate-500 hover:text-slate-800 dark:hover:text-white underline"
          }, "دارس جديد؟ اضغط هنا لتقديم طلب انضمام")
        )
      ) : React.createElement(

        { onSubmit: handleRegisterRequest, className: "space-y-3" },

window.LecturesPage = function(props) {
  var currentUser = props.currentUser || { role: "admin" };
  var utils = window.APP_UTILS;
  var cfg = window.APP_CONFIG;
  var cloud = window.CloudSyncService;

  var [lectures, setLectures] = React.useState(function() {
    return utils.getLocal(cfg.storageKeys.lectures, []);
  });

  var [activeLecture, setActiveLecture] = React.useState(null);
  var [activeSubTab, setActiveSubTab] = React.useState("media"); // 'media', 'summary', 'podcast'
  var [showAddModal, setShowAddModal] = React.useState(false);

  // حالة الذكاء الاصطناعي للمسؤول
  var [isAiGenerating, setIsAiGenerating] = React.useState(false);

  // حقول الفلترة والبحث
  var [searchQuery, setSearchQuery] = React.useState("");
  var [selectedSubject, setSelectedSubject] = React.useState("الكل");
  var [selectedSpeaker, setSelectedSpeaker] = React.useState("الكل");
  var [selectedDate, setSelectedDate] = React.useState("الكل");
  var [sortByDate, setSortByDate] = React.useState("desc");

  // حقول الإضافة والتعديل
  var [selectedFile, setSelectedFile] = React.useState(null);
  var [isDraggingFile, setIsDraggingFile] = React.useState(false);
  var [isUploading, setIsUploading] = React.useState(false);
  var [uploadStatusText, setUploadStatusText] = React.useState("");

  var [editingLecture, setEditingLecture] = React.useState(null); // المحاضرة المراد تعديل مادتها وبياناتها
  var [newTitle, setNewTitle] = React.useState("");
  var [newSubject, setNewSubject] = React.useState("");
  var [newSpeaker, setNewSpeaker] = React.useState("");
  var [newDate, setNewDate] = React.useState(new Date().toISOString().split("T")[0]);
  var [newSessionOrder, setNewSessionOrder] = React.useState(1);
  var [newMediaUrl, setNewMediaUrl] = React.useState(""); // YouTube or Drive link
  var [newNotes, setNewNotes] = React.useState("");

  React.useEffect(function() {
    var unsubscribe = cloud.subscribeLectures(function(cloudList) {
      if (cloudList) {
        setLectures(cloudList);
        utils.setLocal(cfg.storageKeys.lectures, cloudList);
        if (cloudList.length > 0) {
          setActiveLecture(function(prev) {
            return prev ? (cloudList.find(function(l) { return l.id === prev.id; }) || cloudList[0]) : cloudList[0];
          });
        } else {
          setActiveLecture(null);
        }
      }
    });
    return function() {
      if (typeof unsubscribe === "function") unsubscribe();
    };
  }, []);

  var subjectsList = ["الكل"];
  var speakersList = ["الكل"];
  var datesList = ["الكل"];
  lectures.forEach(function(l) {
    if (l.subject && subjectsList.indexOf(l.subject) === -1) subjectsList.push(l.subject);
    if (l.speaker && speakersList.indexOf(l.speaker) === -1) speakersList.push(l.speaker);
    if (l.date && datesList.indexOf(l.date) === -1) datesList.push(l.date);
  });

  var filteredLectures = lectures.filter(function(lec) {
    var matchQuery = (lec.title + " " + (lec.subject || "") + " " + (lec.speaker || "") + " " + (lec.notes || "")).toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
    var matchSubject = selectedSubject === "الكل" || lec.subject === selectedSubject;
    var matchSpeaker = selectedSpeaker === "الكل" || lec.speaker === selectedSpeaker;
    var matchDate = selectedDate === "الكل" || lec.date === selectedDate;
    return matchQuery && matchSubject && matchSpeaker && matchDate;
  });

  filteredLectures.sort(function(a, b) {
    var dateA = new Date(a.date).getTime();
    var dateB = new Date(b.date).getTime();
    if (dateA !== dateB) {
      return sortByDate === "desc" ? dateB - dateA : dateA - dateB;
    }
    return (a.sessionOrder || 1) - (b.sessionOrder || 1);
  });

  // توليد ملخص مكتوب للمحاضرة بالذكاء الاصطناعي (للمسؤول فقط)
  var handleGenerateSummary = async function() {
    if (!activeLecture || currentUser.role !== "admin") return;
    setIsAiGenerating(true);
    try {
      var prompt = "قم بإعداد تلخيص شامل ودقيق وواضح لمحاضرة المشورة: '" + activeLecture.title + "'.\n" +
        "المحاضر: " + activeLecture.speaker + "\n" +
        "الملاحظات الأساسية:\n" + (activeLecture.notes || "مفاهيم الشفاء والنمو النفسي") + "\n\n" +
        "المطلوب: استخراج الأفكار الرئيسية، المفاهيم المحورية، وتطبيقات عملية للدارس بلغة عربية رصينة.";
      var summaryText = await ai.callGemini(prompt);
      
      var updated = Object.assign({}, activeLecture, { writtenSummary: summaryText });
      cloud.saveLecture(updated);
      setActiveLecture(updated);
    } catch (err) {
      alert("خطأ أثناء التوليد: " + err.message);
    } finally {
      setIsAiGenerating(false);
    }
  };

  // توليد سيناريو حوار البودكاست (للمسؤول فقط)
  var handleGeneratePodcast = async function() {
    if (!activeLecture || currentUser.role !== "admin") return;
    setIsAiGenerating(true);
    try {
      var podcastText = await ai.generatePodcastDialogue(activeLecture.title, activeLecture.notes);
      var updated = Object.assign({}, activeLecture, { podcastDialogue: podcastText });
      cloud.saveLecture(updated);
      setActiveLecture(updated);
    } catch (err) {
      alert("خطأ أثناء التوليد: " + err.message);
    } finally {
      setIsAiGenerating(false);
    }
  };

  var processSelectedFile = function(file) {
    if (!file) return;
    setSelectedFile(file);
    if (!newTitle.trim()) {
      setNewTitle(file.name.replace(/\.[^/.]+$/, ""));
    }
  };

  var handleFileSelect = function(e) {
    var file = e.target.files && e.target.files[0];
    if (file) {
      processSelectedFile(file);
    }
  };

  var handleAddLecture = async function(e) {
    e.preventDefault();
    if (!newTitle.trim()) return;

    var finalUrl = newMediaUrl.trim();

    if (selectedFile) {
      try {
        setIsUploading(true);
        setUploadStatusText("جاري قراءة وتجهيز الملف من جهازك...");
        var base64Data = await new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload = function() {
            var result = reader.result;
            var base64 = typeof result === "string" && result.includes(",") ? result.split(",")[1] : result;
            resolve(base64);
          };
          reader.onerror = reject;
          reader.readAsDataURL(selectedFile);
        });

        setUploadStatusText("جاري الرفع المباشر إلى التخزين السحابي...");
        var response = await fetch(cfg.driveUploadEndpoint, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            fileName: selectedFile.name,
            mimeType: selectedFile.type || "application/octet-stream",
            base64Data: base64Data
          })
        });

        var resData = await response.json();
        if (resData.status === "success" && (resData.fileUrl || resData.fileId)) {
          finalUrl = resData.fileUrl || ("https://drive.google.com/file/d/" + resData.fileId + "/view");
        } else {
          throw new Error(resData.message || "تعذر إكمال الرفع");
        }
      } catch (err) {
        alert("تنبيه: حدث خطأ أثناء الرفع السحابي: " + err.message);
        setIsUploading(false);
        setUploadStatusText("");
        return;
      }
    }

    var newLec = {
      id: "lec-" + Date.now(),
      title: newTitle.trim(),
      subject: newSubject.trim() || "عام",
      speaker: newSpeaker.trim() || "غير محدد",
      date: newDate,
      sessionOrder: parseInt(newSessionOrder) || 1,
      mediaUrl: finalUrl,
      notes: newNotes.trim(),
      lastPosition: 0,
      writtenSummary: "",
      podcastDialogue: ""
    };

    cloud.saveLecture(newLec);
    if (window.NotificationService && typeof window.NotificationService.broadcastNewLectureNotification === "function") {
      window.NotificationService.broadcastNewLectureNotification(newLec);
    }
    setShowAddModal(false);
    setIsUploading(false);
    setSelectedFile(null);
    setNewTitle("");
    setNewSubject("");
    setNewSpeaker("");
    setNewMediaUrl("");
    setNewNotes("");
  };

  var openEditModal = function(lec) {

      title: editingLecture.title.trim(),
      subject: (editingLecture.subject || "").trim() || "عام",
      speaker: (editingLecture.speaker || "").trim() || "غير محدد"

    cloud.saveLecture(updated);
    if (activeLecture && activeLecture.id === updated.id) {
      setActiveLecture(updated);
    }
    setEditingLecture(null);
  };

  var handleSavePosition = function(sec) {

    "div",
    { className: "space-y-6 pb-12" },

      { className: "flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm" },

        },
        React.createElement("span", null, "➕"),

  // تنظيف وإيقاف الصوت

  React.useEffect(function() {

  }, []);

  var handlePageChange = function(newPage) {
    if (!activeBook) return;

    setActiveBook(Object.assign({}, activeBook, { currentPage: validPage }));

  };

  // تنظيف النص المقروء من أي تحيات مصطنعة أو عبارات قيادة أو ماركداون
  var cleanSpokenText = function(text) {
    if (!text) return "";
    return text
      .replace(/[#*`_~]/g, "")
      .replace(/\(.*?\)/g, "")
      .replace(/\[.*?\]/g, "")
      .replace(/أهلاً بك( أيها الزميل الدارس)?( في رحلة هادئة ومغذية للروح والوجدان)?[،.]?/g, "")
      .replace(/أهلاً بك عزيزي (المستمع|الدارس|القارئ)[،.]?/g, "")
      .replace(/مرحباً بك( عزيزي)?[،.]?/g, "")
      .replace(/بصفتي (الذكاء الاصطناعي|مساعدك الذكي)[،.]?/g, "")
      .replace(/بينما تقود سيارتك( الآن)?[،.]?/g, "")
      .replace(/أثناء القيادة( بالسيارة)?[،.]?/g, "")
      .replace(/في سيارتك[،.]?/g, "")
      .replace(/أثناء قيادتك للسيارة[،.]?/g, "")
      .replace(/أثناء قيادة السيارة[،.]?/g, "")
      .replace(/للاستماع أثناء القيادة[،.]?/g, "")
      .replace(/في طريقك[،.]?/g, "")
      .replace(/\s+/g, " ")
      .trim();
  };

  // تقسيم النص إلى جمل متوسطة مريحة للأذن ولا تقطع في أي متصفح
  var splitIntoSpokenChunks = function(text) {
    if (!text) return [];
    var rawParts = text.split(/([.\n،؛!؟]+)/);
    var chunks = [];
    var cur = "";
    for (var i = 0; i < rawParts.length; i++) {
      var part = rawParts[i].trim();
      if (!part) continue;
      if ((cur + " " + part).length <= 110) {
        cur = cur ? (cur + " " + part) : part;
      } else {
        if (cur) chunks.push(cur);
        if (part.length > 110) {
          var words = part.split(/\s+/);
          var subCur = "";
          for (var w = 0; w < words.length; w++) {
            if ((subCur + " " + words[w]).length <= 110) {
              subCur = subCur ? (subCur + " " + words[w]) : words[w];
            } else {
              if (subCur) chunks.push(subCur);
              subCur = words[w];
            }
          }
          if (subCur) cur = subCur;
          else cur = "";
        } else {
          cur = part;
        }
      }
    }
    if (cur) chunks.push(cur);
    return chunks.length > 0 ? chunks : [text];
  };

  // تحميل قائمة الأصوات المتاحة بالجهاز فور توفرها
  React.useEffect(function() {
    var updateVoicesList = function() {
      if (!("speechSynthesis" in window)) return;
      var voices = window.speechSynthesis.getVoices() || [];
      var ar = voices.filter(function(v) {
        var l = (v.lang || "").toLowerCase();
        return l.startsWith("ar") || l.indexOf("arabic") !== -1;
      });
      // إذا لم يكن هناك أصوات عربية، نعرض كل الأصوات
      var list = ar.length > 0 ? ar : voices;
      setAvailableVoices(list);
      if (list.length > 0 && !selectedVoiceUri) {
        setSelectedVoiceUri(list[0].voiceURI || list[0].name);
      }
    };

    updateVoicesList();
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = updateVoicesList;
    }
  }, []);

  // عداد الوقت المنقضي أثناء تشغيل الصوت
  React.useEffect(function() {
    var timer = null;
    if (speakingChapterIdx !== null && !isAudioPaused) {
      timer = setInterval(function() {
        setAudioElapsedSec(function(prev) { return prev + 1; });
      }, 1000);
    }
    return function() {
      if (timer) clearInterval(timer);
    };
  }, [speakingChapterIdx, isAudioPaused]);

  // دالة لاختيار أفضل صوت أنثوي مصري أو عربي متاح
  var getBestEgyptianFemaleVoice = function() {
    if (!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    if (!voices || voices.length === 0) return null;

    // 1. صوت مصري أنثوي صريح
    var egFemale = voices.find(function(v) {
      var l = (v.lang || "").toLowerCase();
      var n = (v.name || "").toLowerCase();
      var isEg = l.indexOf("eg") !== -1;
      var isFem = n.indexOf("female") !== -1 || n.indexOf("salma") !== -1 || n.indexOf("hoda") !== -1 || n.indexOf("laila") !== -1 || n.indexOf("mariam") !== -1 || n.indexOf("zeina") !== -1;
      return isEg && isFem;
    });
    if (egFemale) return egFemale;

    // 2. أي صوت أنثوي عربي
    var arFemale = voices.find(function(v) {
      var l = (v.lang || "").toLowerCase();
      var n = (v.name || "").toLowerCase();
      var isAr = l.startsWith("ar") || l.indexOf("arabic") !== -1;
      var isFem = n.indexOf("female") !== -1 || n.indexOf("salma") !== -1 || n.indexOf("hoda") !== -1 || n.indexOf("laila") !== -1 || n.indexOf("mariam") !== -1 || n.indexOf("zeina") !== -1 || n.indexOf("zari") !== -1 || n.indexOf("fatima") !== -1;
      return isAr && isFem;
    });
    if (arFemale) return arFemale;

    // 3. أي صوت مصري عام
    var egGen = voices.find(function(v) {
      return (v.lang || "").toLowerCase().indexOf("eg") !== -1;
    });
    if (egGen) return egGen;

    // 4. أي صوت عربي متاح في النظام
    var arGen = voices.find(function(v) {
      var l = (v.lang || "").toLowerCase();
      return l.startsWith("ar") || l.indexOf("arabic") !== -1;
    });
    return arGen || null;
  };

  // تشغيل الجملة المحددة بمحرك الكلام الصوتي
  var speakChunkAtIndex = function(idx) {
    var p = audioPlayerRef.current;
    if (!p.isPlaying || p.isPaused) return;

    if (idx < 0 || idx >= p.chunks.length) {
      stopAudioPlayback();
      return;
    }

    p.chunkIdx = idx;
    setAudioProgress({ current: idx + 1, total: p.chunks.length });

    // تحديث موضع الوقت التقديري بناءً على الجملة
    if (audioDurationSec > 0 && p.chunks.length > 0) {
      var estSec = Math.floor((idx / p.chunks.length) * audioDurationSec);
      setAudioElapsedSec(estSec);
    }

    if (!("speechSynthesis" in window)) {
      alert("خاصية الصوت غير مدعومة في هذا المتصفح.");
      stopAudioPlayback();
      return;
    }

    var chunk = p.chunks[idx];
    if (!chunk || !chunk.trim()) {
      if (idx + 1 < p.chunks.length) {
        speakChunkAtIndex(idx + 1);
      } else {
        stopAudioPlayback();
      }
      return;
    }

    var utterance = new SpeechSynthesisUtterance(chunk);
    utterance.rate = p.playbackRate || 1.0;
    utterance.pitch = 1.15; // نبرة هادئة ودافئة وأنثوية

    var voice = getBestEgyptianFemaleVoice();
    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang || "ar-SA";
    } else {
      utterance.lang = "ar-SA";
    }

    // حفظ المرجع عالمياً لمنع V8 Garbage Collection من قطع الصوت فوراً
    window._activeTtsUtterance = utterance;
    p.utterance = utterance;

    // علم لمنع التكرار المزدوج
    var hasHandledCompletion = false;

    utterance.onend = function() {
      if (hasHandledCompletion) return;
      hasHandledCompletion = true;
      window._activeTtsUtterance = null;
      if (!p.isPlaying || p.isPaused) return;

      if (p.chunkIdx + 1 < p.chunks.length) {
        speakChunkAtIndex(p.chunkIdx + 1);
      } else {
        stopAudioPlayback();
      }
    };

    utterance.onerror = function(err) {
      if (hasHandledCompletion) return;
      window._activeTtsUtterance = null;
      // لا تفعل شيئاً إذا كان الصوت متوقفاً أو تم مقاطعته عمداً
      if (!p.isPlaying || p.isPaused) return;

      // تجاهل أخطاء المقاطعة والإلغاء حتى لا تسبب القفز السريع
      if (err && (err.error === "canceled" || err.error === "interrupted")) {
        return;
      }

      hasHandledCompletion = true;
      console.warn("TTS Error Notice:", err);

      // في حال حدوث خطأ حقيقي ننتقل للجملة التالية بعد ثانية كاملة لمنع الجريان السريع
      setTimeout(function() {
        if (p.isPlaying && !p.isPaused && p.chunkIdx + 1 < p.chunks.length) {
          speakChunkAtIndex(p.chunkIdx + 1);
        } else {
          stopAudioPlayback();
        }
      }, 1000);
    };

    // استئناف محرك الصوت في حال كان معلقاً
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }

    try {
      window.speechSynthesis.speak(utterance);
    } catch (e) {
      console.error("speechSynthesis.speak failed:", e);
    }
  };

  // تشغيل / إيقاف المشغل الصوتي
  var handleToggleSpeech = function(chapterIndex, textToRead) {
    var p = audioPlayerRef.current;

    if (speakingChapterIdx === chapterIndex) {
      if (isAudioPaused) {
        // استئناف
        p.isPaused = false;
        setIsAudioPaused(false);
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        } else {
          speakChunkAtIndex(p.chunkIdx);
        }
      } else {
        // إيقاف مؤقت
        p.isPaused = true;
        setIsAudioPaused(true);
        if (window.speechSynthesis) {
          window.speechSynthesis.pause();
        }
      }
      return;
    }

    stopAudioPlayback();

    var cleanText = cleanSpokenText(textToRead);
    if (!cleanText) {
      alert("لا يوجد نص متاح للقراءة في هذا الملخص.");
      return;
    }

    var chunks = splitIntoSpokenChunks(cleanText);
    if (chunks.length === 0) return;

    // حساب المدة التقديرية بالثواني بناءً على عدد الكلمات (معدل 130 كلمة بالدقيقة)
    var wordCount = cleanText.split(/\s+/).filter(Boolean).length;
    var estTotalSeconds = Math.max(30, Math.round((wordCount / 130) * 60));
    setAudioDurationSec(estTotalSeconds);
    setAudioElapsedSec(0);

    p.isPlaying = true;
    p.isPaused = false;
    p.chapterIdx = chapterIndex;
    p.chunks = chunks;
    p.chunkIdx = 0;
    p.playbackRate = audioPlaybackRate;

    setSpeakingChapterIdx(chapterIndex);
    setIsAudioPaused(false);
    speakChunkAtIndex(0);
  };

  // تقديم 10 ثوانٍ (جملة للأمام)
  var handleAudioSeekForward = function() {
    var p = audioPlayerRef.current;
    if (!p.isPlaying) return;
    var nextIdx = Math.min(p.chunks.length - 1, p.chunkIdx + 1);
    p.isPaused = false;
    setIsAudioPaused(false);
    speakChunkAtIndex(nextIdx);
  };

  // ترجيع 10 ثوانٍ (جملة للخلف)
  var handleAudioSeekBackward = function() {
    var p = audioPlayerRef.current;
    if (!p.isPlaying) return;
    var prevIdx = Math.max(0, p.chunkIdx - 1);
    p.isPaused = false;
    setIsAudioPaused(false);
    speakChunkAtIndex(prevIdx);
  };

  // القفز إلى موضع محدد عبر شريط التقدم التفاعلي (Slider)
  var handleAudioProgressSeek = function(e) {
    var p = audioPlayerRef.current;
    if (!p.isPlaying || p.chunks.length === 0) return;
    var targetFraction = parseFloat(e.target.value);
    var targetIdx = Math.min(p.chunks.length - 1, Math.floor(targetFraction * p.chunks.length));
    var newElapsed = Math.floor(targetFraction * audioDurationSec);
    setAudioElapsedSec(newElapsed);
    p.isPaused = false;
    setIsAudioPaused(false);
    speakChunkAtIndex(targetIdx);
  };

  // تغيير سرعة القراءة (1x, 1.25x, 1.5x, 0.85x)
  var handleAudioSpeedChange = function(newRate) {
    setAudioPlaybackRate(newRate);
    var p = audioPlayerRef.current;
    p.playbackRate = newRate;
    if (p.isPlaying && !p.isPaused) {
      speakChunkAtIndex(p.chunkIdx);
    }
  };

  // تغيير صوت القارئ (ذكر / أنثى) فوراً
  var handleVoiceChange = function(voiceUri) {
    setSelectedVoiceUri(voiceUri);
    var p = audioPlayerRef.current;
    if (p.isPlaying && !p.isPaused) {
      speakChunkAtIndex(p.chunkIdx);
    }
  };

  // توليد ملخص صوتي ومكتوب احترافي بدون عبارات نمطية
  var handleGenerateChapterSummary = async function(chapterIndex) {
    if (!activeBook || currentUser.role !== "admin") return;

    var existingKey = await ai.getApiKey();
    if (!existingKey) {
      var entered = window.prompt("يرجى إدخال مفتاح Gemini API لتفعيل التلخيص الذكي وحفظه سحابياً ومحلياً:");
      if (!entered || !entered.trim()) {
        return;
      }
      await ai.saveApiKey(entered.trim());
      utils.setLocal(cfg.storageKeys.apiKey, entered.trim());
    }

    setIsAiGenerating(true);
    try {
      var ch = (activeBook.chapters || [])[chapterIndex];
      var chName = ch.title || ("الفصل " + chapterIndex);
      var prompt = "أنت باحث ومتخصص في علوم المشورة والنمو الإنساني.\n" +
        "قم بإعداد دراسة وتلخيص مركز ومكثف لـ: '" + chName + "' من كتاب: '" + activeBook.title + "' للمؤلف '" + (activeBook.author || "") + "'.\n" +
        "شروط هامة جداً:\n" +
        "- اكتب الملخص المكتوب (writtenSummary) بلغة عربية فصيحة سلسة وواضحة، بأسلوب علمي وإنساني طبيعي.\n" +
        "- اكتب السيناريو الصوتي (audioScript) بلهجة مصرية عامية راقية وودودة وهادئة (مثل بودكاست مصري مشوق يقرأ بصوت متكلمة مصرية تشرح لصديق)، يسهل جداً على الأذن سماعه وفهمه والاستمتاع به.\n" +
        "- ادخل مباشرة في جوهر الأفكار والتحليل النفسي والروحي والتطبيقات العملية دون أي مقدمات نمطية أو ترحيبات سطحية.\n" +
        "- لا تذكر نهائياً عبارات مثل (أثناء القيادة، السيارة، الذكاء الاصطناعي، مرحباً بك، بصفتي مساعدك).\n" +
        "المطلوب إرجاع صيغة JSON نظيفة:\n" +

    if (currentUser.role !== "admin") return;

        "1. الخريطة الذهنية الكبرى للمنهج.\n" +

        React.createElement("li", null, "انسخ رابط الملف وضعه في خانة الرابط عند إضافة محاضرة أو كتاب جديد داخل التطبيق."),

};

// Module: App.js
// المكون الرئيسي App.js مع دمج نظام التقاط وبلاغات الأعطال
function App() {
  var utils = window.APP_UTILS;
  var cfg = window.APP_CONFIG;

  var [activeTab, setActiveTab] = React.useState("lectures");
  var [isSidebarOpen, setIsSidebarOpen] = React.useState(false);
  var [isAuthOpen, setIsAuthOpen] = React.useState(false);
  var [isErrorReportOpen, setIsErrorReportOpen] = React.useState(false);

  var [isInstallPromptOpen, setIsInstallPromptOpen] = React.useState(false);
  var [deferredPrompt, setDeferredPrompt] = React.useState(null);
  var [hasNotificationPermission, setHasNotificationPermission] = React.useState(function() {
    return ("Notification" in window) && Notification.permission === "granted";
  });

  var [hasUpdateAvailable, setHasUpdateAvailable] = React.useState(false);

  // مراقبة توفر تحديث جديد للمنصة فوراً عند كل رفع
  React.useEffect(function() {
    var checkAppUpdate = async function() {
      try {
        var base = window.location.href.split("#")[0].split("?")[0];
        var response = await fetch(base + "?t=" + Date.now(), {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
        });
        if (response.ok) {
          var htmlText = await response.text();
          var match = htmlText.match(/version:\s*"([^"]+)"/);
          var bTimeMatch = htmlText.match(/buildTime:\s*"([^"]+)"/);
          if (match && match[1] && match[1] !== cfg.version) {
            setHasUpdateAvailable(true);
          } else if (bTimeMatch && bTimeMatch[1] && bTimeMatch[1] !== cfg.buildTime) {
            setHasUpdateAvailable(true);
          }
        }
      } catch (e) {}
    };

    var interval = setInterval(checkAppUpdate, 5000);
    checkAppUpdate();

    var onFocus = function() { checkAppUpdate(); };
    window.addEventListener("focus", onFocus);
    window.addEventListener("visibilitychange", onFocus);

    return function() {
      clearInterval(interval);
      window.removeEventListener("focus", onFocus);
      window.removeEventListener("visibilitychange", onFocus);
    };
  }, []);

  // التقاط حدث تثبيت التطبيق PWA
  React.useEffect(function() {
    var handleBeforeInstall = function(e) {
      e.preventDefault();
      setDeferredPrompt(e);
    };
    window.addEventListener("beforeinstallprompt", handleBeforeInstall);

    // الاستماع للإشعارات الواردة
    var unsubscribeNotifs = function() {};
    if (window.NotificationService && typeof window.NotificationService.subscribeNotifications === "function") {
      var initialLoad = true;
      unsubscribeNotifs = window.NotificationService.subscribeNotifications(function(list) {
        if (!initialLoad && list.length > 0) {
          var latest = list[0];
          if ("Notification" in window && Notification.permission === "granted") {
            try {
              new Notification(latest.title, {
                body: latest.body,
                icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E🌿%3C/text%3E%3C/svg%3E"
              });
            } catch (err) {}
          }
        }
        initialLoad = false;
      });
    }

    return function() {
      window.removeEventListener("beforeinstallprompt", handleBeforeInstall);
      if (typeof unsubscribeNotifs === "function") unsubscribeNotifs();
    };
  }, []);

  var handleToggleNotification = async function() {
    if (window.NotificationService && typeof window.NotificationService.requestPermission === "function") {
      var granted = await window.NotificationService.requestPermission();
      setHasNotificationPermission(granted);
    }
  };

  var [currentUser, setCurrentUser] = React.useState(function() {
    return utils.getLocal("counsel_current_user", {
      fullName: "الأدمن",
      email: "eng.nader.reda@gmail.com",
      phone: "01275571569",
      role: "admin",
      status: "approved"
    });
  });

  var [theme, setTheme] = React.useState(function() {
    return utils.getLocal(cfg.storageKeys.theme, "light");
  });

  React.useEffect(function() {
    if (theme === "dark") {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
    utils.setLocal(cfg.storageKeys.theme, theme);
  }, [theme]);

  var handleToggleTheme = function() {
    setTheme(theme === "dark" ? "light" : "dark");
  };

  var handleLoginSuccess = function(userData) {
    setCurrentUser(userData);
    utils.setLocal("counsel_current_user", userData);
    alert("مرحباً بك يا " + (userData.fullName || "زميلنا العزيز") + "! تم تسجيل الدخول بنجاح.");
  };

  return React.createElement(
    "div",
    { className: "min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col font-cairo" },

    React.createElement(window.Sidebar, {
      activeTab: activeTab,
      onTabChange: setActiveTab,
      currentUser: currentUser,
      onOpenAuth: function() { setIsAuthOpen(true); },
      isOpen: isSidebarOpen,
      onClose: function() { setIsSidebarOpen(false); },
      hasNotificationPermission: hasNotificationPermission,
      onToggleNotification: handleToggleNotification,
      onOpenInstallPrompt: function() { setIsInstallPromptOpen(true); },
      onOpenErrorReport: function() { setIsErrorReportOpen(true); }
    }),

    React.createElement(
      "div",
      { className: "flex-1 flex flex-col min-w-0 transition-all duration-300 w-full" },

      // شريط إشعار بوجود تحديث جديد يظل معلقاً وثابتاً في أعلى الشاشة دائماً حتى عند النزول لأسفل
      hasUpdateAvailable && React.createElement(
        "div",
        {
          className: "fixed top-0 inset-x-0 z-50 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-white px-3 sm:px-6 py-2.5 text-xs sm:text-sm font-bold flex items-center justify-between shadow-xl border-b-2 border-orange-600/80 animate-pulse backdrop-blur-sm"
        },
        React.createElement(
          "div",
          { className: "flex items-center gap-2 min-w-0" },
          React.createElement("span", { className: "text-base sm:text-lg shrink-0 animate-bounce" }, "🚀"),
          React.createElement("span", { className: "truncate sm:whitespace-normal font-bold drop-shadow-xs" }, "يتوفر تحديث جديد للمنصة الآن! اضغط لتطبيقه فوراً.")
        ),
        React.createElement(
          "button",
          {
            onClick: function() {
              if ("caches" in window) {
                caches.keys().then(function(names) {
                  for (var i = 0; i < names.length; i++) caches.delete(names[i]);
                });
              }
              window.location.reload(true);
            },
            className: "bg-white text-orange-600 hover:text-orange-700 px-3.5 py-1.5 rounded-xl text-xs font-black hover:bg-orange-50 shadow-md transition-all active:scale-95 whitespace-nowrap shrink-0 border border-orange-200"
          },
          "اضغط هنا للتحديث 🔄"
        )
      ),

      // الترويسة العلوية الثابتة دائماً أثناء التمرير
      React.createElement(
        "div",
        { className: "sticky top-0 z-30 flex flex-col shadow-sm" + (hasUpdateAvailable ? " pt-11 sm:pt-12" : "") },
        React.createElement(window.Header, {
          isSidebarOpen: isSidebarOpen,
          onOpenSidebar: function() { setIsSidebarOpen(function(prev) { return !prev; }); },
          theme: theme,
          onToggleTheme: handleToggleTheme,
          currentUser: currentUser,
          onOpenErrorReport: function() { setIsErrorReportOpen(true); },
          hasNotificationPermission: hasNotificationPermission,
          onToggleNotification: handleToggleNotification,
          onOpenInstallPrompt: function() { setIsInstallPromptOpen(true); }
        })
      ),

      React.createElement(
        "main",
        { className: "flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 md:px-8 py-5 pb-20 md:pb-8" },
        activeTab === "lectures" && React.createElement(window.LecturesPage, { currentUser: currentUser }),
        activeTab === "books" && React.createElement(window.BooksPage, { currentUser: currentUser }),
        activeTab === "curriculum" && React.createElement(window.CurriculumPage, { currentUser: currentUser }),
        activeTab === "notes" && React.createElement(window.NotesPage, { currentUser: currentUser }),
        activeTab === "users" && React.createElement(window.UsersManagementPage, { currentUser: currentUser }),
        activeTab === "errors" && React.createElement(window.ErrorReportsAdminPage, { currentUser: currentUser }),
        activeTab === "settings" && React.createElement(window.SettingsPage, { currentUser: currentUser })
      )
    ),

    React.createElement(window.BottomNav, {
      activeTab: activeTab,
      onTabChange: setActiveTab,
      onToggleSidebar: function() { setIsSidebarOpen(function(prev) { return !prev; }); }
    }),

    React.createElement(window.AuthModal, {
      isOpen: isAuthOpen,
      onClose: function() { setIsAuthOpen(false); },
      onLoginSuccess: handleLoginSuccess
    }),

    React.createElement(window.ErrorReporterModal, {
      isOpen: isErrorReportOpen,
      onClose: function() { setIsErrorReportOpen(false); },
      currentUser: currentUser,
      activeTab: activeTab
    }),

    React.createElement(window.InstallPromptModal, {
      isOpen: isInstallPromptOpen,
      onClose: function() { setIsInstallPromptOpen(false); },
      deferredPrompt: deferredPrompt,
      onInstalled: function() {
        setDeferredPrompt(null);
        alert("تهانينا! تم تثبيت تطبيق منصة المشورة بنجاح على جهازك.");
      }
    })
  );
}

ReactDOM.render(React.createElement(App, null), document.getElementById("root"));

  </script>
</body>
