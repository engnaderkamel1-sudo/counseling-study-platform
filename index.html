// Module: config/appConfig.js
// إعدادات التطبيق وتخزين المفاتيح
window.APP_CONFIG = {

  version: "1.2.1791721332",

  // مفاتيح التخزين المحلي الآمن
  storageKeys: {
    apiKey: "counsel_ai_api_key",
    theme: "counsel_theme",

// Module: config/firebase.js
// تهيئة وإعداد فايربيز وقاعدة البيانات السحابية لمشروع دراسة المشورة
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyBgodgcRNLnPJrZMqJ_d2pdnyTvESDVeT8",
  authDomain: "counseling-study-app.firebaseapp.com",
  projectId: "counseling-study-app",
  storageBucket: "counseling-study-app.firebasestorage.app",
  messagingSenderId: "423516287917",
  appId: "1:423516287917:web:8e9067abd3b71f900b2724"
};

(function() {
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(window.FIREBASE_CONFIG);
    }
    window.db = firebase.firestore();
    if (typeof firebase.auth === "function") {
      try {
        window.auth = firebase.auth();
      } catch (authErr) {
        console.warn("Firebase auth init warning:", authErr);
      }
    }
    if (typeof firebase.storage === "function") {
      try {
        window.storage = firebase.storage();
      } catch (storageErr) {
        console.warn("Firebase storage init warning:", storageErr);
      }
    }
    
    // تم تعطيل enablePersistence لحماية الأجهزة من التخزين المؤقت القديم (IndexedDB Cache Poisoning)
    // التطبيق يعتمد على التخزين المحلي النظيف localStorage مع المزامنة المباشرة
    console.log("Firebase connected successfully to counseling-study-app (direct realtime mode)");

})();

// Module: services/cloudSync.js
// خدمة المزامنة السحابية اللحظية مع فايربيز
window.CloudSyncService = {
  // الاشتراك اللحظي في المحاضرات
  subscribeLectures: function(onUpdate) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("lectures").orderBy("date", "desc").onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        onUpdate(list);
      }, function(err) {
        console.warn("Firestore lectures read fallback to local:", err);
      });
    } catch (e) {
      return function() {};
    }
  },

  // حفظ أو تعديل محاضرة سحابياً
  saveLecture: function(lecture) {
    if (!window.db) return Promise.resolve();
    var docId = lecture.id || ("lec-" + Date.now());
    var data = Object.assign({}, lecture, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return window.db.collection("lectures").doc(docId).set(data, { merge: true });
  },

  // حفظ موضع الاستماع فقط (ثانية التوقف) لتوفير الباندويث
  updatePlaybackPosition: function(lectureId, seconds) {
    if (!window.db || !lectureId) return Promise.resolve();
    return window.db.collection("lectures").doc(lectureId).set({
      lastPosition: seconds,
      lastPlayedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  },

  // تحويل كائنات Firestore REST إلى كائنات JavaScript عادية
  parseFirestoreValue: function(val) {
    if (!val || typeof val !== "object") return val;
    if ("stringValue" in val) return val.stringValue;
    if ("booleanValue" in val) return val.booleanValue;
    if ("integerValue" in val) return parseInt(val.integerValue, 10);
    if ("doubleValue" in val) return parseFloat(val.doubleValue);
    if ("nullValue" in val) return null;
    if ("arrayValue" in val) {
      var arr = (val.arrayValue && val.arrayValue.values) || [];
      var self = this;
      return arr.map(function(item) { return self.parseFirestoreValue(item); });
    }
    if ("mapValue" in val) {
      var res = {};
      var fields = (val.mapValue && val.mapValue.fields) || {};
      var self = this;
      Object.keys(fields).forEach(function(k) {
        res[k] = self.parseFirestoreValue(fields[k]);
      });
      return res;
    }
    return val;
  },

  parseFirestoreDoc: function(doc) {
    var fields = doc.fields || {};
    var res = {};
    var self = this;
    Object.keys(fields).forEach(function(k) {
      res[k] = self.parseFirestoreValue(fields[k]);
    });
    if (!res.id && doc.name) {
      var parts = doc.name.split("/");
      res.id = parts[parts.length - 1];
    }
    return res;
  },

  // الاشتراك اللحظي في الكتب مع جلب مباشر فوري ومضمون (Direct REST Fetch + Realtime Listener)
  subscribeBooks: function(onUpdate) {
    var self = this;
    var hasDelivered = false;

    var handleUpdate = function(list) {
      if (!list || !Array.isArray(list)) return;
      hasDelivered = true;
      if (typeof onUpdate === "function") {
        onUpdate(list);
      }
    };

    // 1. جلب فوري ومباشر وسريع جداً عبر REST API لتخطي أي قيود لشبكات المحمول أو المتصفح الخفي (Incognito)
    var fetchRestBooks = function(retryCount) {
      var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var timeoutId = controller ? setTimeout(function() { controller.abort(); }, 12000) : null;
      var fetchOpts = {
        cache: "no-store",
        headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
      };
      var apiKey = (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey) || "";
      var restUrl = "https://firestore.googleapis.com/v1/projects/counseling-study-app/databases/(default)/documents/books?key=" + apiKey;
      if (controller) fetchOpts.signal = controller.signal;

      fetch(restUrl, fetchOpts)
        .then(function(res) {
          if (timeoutId) clearTimeout(timeoutId);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(data) {
          if (data && data.documents && Array.isArray(data.documents)) {
            var restList = data.documents.map(function(d) { return self.parseFirestoreDoc(d); });
            restList = restList.filter(function(b) { return !b.isDeleted; });
            if (restList.length > 0) {
              handleUpdate(restList);
            }
          }
        })
        .catch(function(errRest) {
          if (timeoutId) clearTimeout(timeoutId);
          console.warn("Direct REST books fetch notice:", errRest && errRest.message);
          // إعادة محاولة واحدة سريعة إذا لم يكن قد تم تسليم أي بيانات بعد
          if (!hasDelivered && (retryCount || 0) < 2) {
            setTimeout(function() { fetchRestBooks((retryCount || 0) + 1); }, 1500);
          }
        });
    };

    fetchRestBooks(0);

    if (!window.db) return function() {};
    try {
      // 2. الاستماع اللحظي المستمر لأي تحديث جديد
      return window.db.collection("books").onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        handleUpdate(list);
      }, function(err) {
        console.warn("Firestore subscribeBooks realtime error:", err);
      });
    } catch (e) {
      return function() {};
    }
  },

  // تنقية الكائنات من أي قيم undefined أو دوال أو نصوص Base64 مفرطة الحجم لمنع رفض فايربيز الصامت
  sanitizeForFirestore: function(obj) {
    if (obj === null || obj === undefined) return null;
    if (typeof obj !== "object") {
      // حماية الحجم: السماح بالغلاف إذا كان Base64 خفيف أو رابط، وحذف النصوص المفرطة الحجم فقط لمنع تخطي 1 ميجابايت
      if (typeof obj === "string" && obj.indexOf("data:image/") === 0 && obj.length > 200000) {
        return "";
      }
      return obj;
    }
    if (Array.isArray(obj)) {
      return obj.map(function(item) {
        return window.CloudSyncService.sanitizeForFirestore(item);
      });
    }
    var cleaned = {};
    Object.keys(obj).forEach(function(key) {
      var val = obj[key];
      if (val !== undefined && typeof val !== "function") {
        cleaned[key] = window.CloudSyncService.sanitizeForFirestore(val);
      }
    });
    return cleaned;
  },

  // حفظ أو تعديل كتاب مع تنقية سحابية آمنة وحماية المستند من تجاوز 1MB
  saveBook: function(book) {
    if (!window.db || !book) return Promise.resolve();
    var docId = book.id || ("book-" + Date.now());
    try {
      // حفظ الغلاف في الكاش المحلي لضمان ظهوره الفوري دائماً على الجهاز
      if (book.coverUrl && typeof book.coverUrl === "string" && book.coverUrl.trim()) {
        try {
          if (window.APP_UTILS && window.APP_UTILS.setLocal) {
            window.APP_UTILS.setLocal("counsel_cover_thumb_" + docId, book.coverUrl);
          }
        } catch (eThumb) {}
      }

      var cleanBook = this.sanitizeForFirestore(book);
      // إذا كان الغلاف كود Base64 ضخم جداً (> 200KB)، لا نرفعه لسحابة فايربيز بل نكتفي بالكاش المحلي
      if (cleanBook.coverUrl && typeof cleanBook.coverUrl === "string" && cleanBook.coverUrl.indexOf("data:") === 0 && cleanBook.coverUrl.length > 200000) {
        cleanBook.coverUrl = "";
      }
      // مزامنة حالة النشر بدقة لمنع إخفاء الكتاب عن الطلبة بالخطأ
      if (cleanBook.publishStatus === "published") {
        cleanBook.isPublished = true;
      } else if (cleanBook.publishStatus === "draft") {
        cleanBook.isPublished = false;
      }
      return window.db.collection("books").doc(docId).set(cleanBook, { merge: true }).catch(function(err) {
        console.error("Firestore saveBook error for " + docId + ":", err);
        throw err;
      });
    } catch (e) {
      console.error("Error sanitizing book for Firestore:", e);
      return Promise.reject(e);
    }
  },

  // حفظ موضع الصفحة فقط في الكتاب
  updateBookPage: function(bookId, page) {
    if (!window.db || !bookId) return Promise.resolve();
    return window.db.collection("books").doc(bookId).set({
      currentPage: page
    }, { merge: true });
  },

  // حفظ واسترجاع نصوص الصفحات المستخرجة بالذكاء الاصطناعي (Cloud Cache لتوفير الـ Quota)
  saveCachedPageText: function(bookId, pageNum, text) {
    if (!window.db || !bookId || !pageNum || !text) return Promise.resolve();
    return window.db.collection("books").doc(bookId).collection("cached_pages").doc("p_" + pageNum).set({
      page: pageNum,
      text: text,
      cachedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  },

  getCachedPageText: async function(bookId, pageNum) {
    if (!window.db || !bookId || !pageNum) return null;
    try {
      var doc = await window.db.collection("books").doc(bookId).collection("cached_pages").doc("p_" + pageNum).get();
      if (doc.exists && doc.data() && doc.data().text) {
        return doc.data().text;
      }
    } catch (e) {
      console.warn("getCachedPageText error:", e);
    }
    return null;
  },

  // الاشتراك في الملاحظات الدراسية (مع فصل الملاحظات لكل مستخدم)
  subscribeNotes: function(currentUser, onUpdate) {
    if (!window.db) return function() {};
    if (typeof currentUser === "function") {
      onUpdate = currentUser;
      currentUser = null;
    }
    try {
      var query = window.db.collection("personal_notes");
      if (currentUser && (currentUser.id || currentUser.email)) {
        var userIdentifier = currentUser.id || currentUser.email;
        query = query.where("userId", "==", userIdentifier);
      }
      return query.onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        list.sort(function(a, b) {
          return String(b.date || "").localeCompare(String(a.date || ""));
        });
        onUpdate(list);
      });
    } catch (e) {
      return function() {};
    }
  },

  saveNote: function(note, currentUser) {
    if (!window.db) return Promise.resolve();
    var docId = note.id || ("note-" + Date.now());
    if (currentUser && (currentUser.id || currentUser.email) && !note.userId) {
      note.userId = currentUser.id || currentUser.email;
    }
    return window.db.collection("personal_notes").doc(docId).set(note, { merge: true });
  },

  // حذف مستند عام من أي مجموعة (Collection)
  deleteDocument: async function(collectionName, docId) {
    if (!window.db || !collectionName || !docId) return true;
    try {
      await window.db.collection(collectionName).doc(docId).delete();
      return true;
    } catch (e) {
      console.error("Firestore deleteDocument error:", e);
      throw e;
    }
  },

  // حذف كتاب (نهائي)
  deleteBook: async function(bookId) {
    return this.deleteDocument("books", bookId);
  },

  // ==========================================
  // منظومة سلة المحذوفات والأرشيف المؤقت (7 أيام)
  // ==========================================
  RECYCLE_RETENTION_MS: 7 * 24 * 60 * 60 * 1000, // أسبوع كامل

  // الاشتراك في سلة المحذوفات مع التنظيف التلقائي للعناصر المنتهية صلاحيتها
  subscribeRecycleBin: function(onUpdate) {
    var self = this;
    if (!window.db) return function() {};
    try {
      return window.db.collection("recycle_bin").orderBy("deletedAt", "desc").onSnapshot(function(snapshot) {
        var list = [];
        var now = Date.now();
        snapshot.forEach(function(doc) {
          var data = Object.assign({ id: doc.id }, doc.data());
          // إذا مر أكثر من 7 أيام، نحذف العنصر نهائياً وتلقائياً
          if (data.deletedAt && (now - data.deletedAt > self.RECYCLE_RETENTION_MS)) {
            self.permanentDeleteFromRecycleBin(doc.id).catch(function() {});
          } else {
            list.push(data);
          }
        });
        if (typeof onUpdate === "function") onUpdate(list);
      }, function(err) {
        console.warn("Recycle bin realtime listener notice:", err);
      });
    } catch (e) {
      return function() {};
    }
  },

  // نقل كتاب أو محاضرة إلى سلة المحذوفات (Soft Delete)
  moveToRecycleBin: async function(item, type, user) {
    if (!item) return false;
    var self = this;
    var docId = type + "_" + (item.id || Date.now());
    var recycleRecord = {
      id: docId,
      originalId: item.id,
      originalType: type, // "book" أو "lecture"
      itemData: self.sanitizeForFirestore(item),
      title: item.title || "عنصر بدون عنوان",
      author: item.author || item.speaker || "",
      deletedAt: Date.now(),
      deletedBy: (user && user.fullName) || "الأدمن"
    };

    if (window.db) {
      try {
        await window.db.collection("recycle_bin").doc(docId).set(recycleRecord);
        // حذفه من المجموعة الأصلية النشطة
        var targetCollection = type === "book" ? "books" : "lectures";
        await window.db.collection(targetCollection).doc(item.id).delete();
      } catch (err) {
        console.error("moveToRecycleBin cloud error:", err);
      }
    }

    // تحديث التخزين المحلي
    try {
      var utils = window.APP_UTILS;
      if (utils) {
        var localBin = utils.getLocal("counsel_recycle_bin", []) || [];
        localBin.unshift(recycleRecord);
        utils.setLocal("counsel_recycle_bin", localBin);

        if (type === "book") {
          var allB = utils.getLocal(window.APP_CONFIG.storageKeys.books, []) || [];
          utils.setLocal(window.APP_CONFIG.storageKeys.books, allB.filter(function(b) { return b.id !== item.id; }));
          utils.removeLocal("counsel_book_data_" + item.id);
          utils.removeLocal("counsel_book_page_" + item.id);
        } else if (type === "lecture") {
          var allL = utils.getLocal(window.APP_CONFIG.storageKeys.lectures, []) || [];
          utils.setLocal(window.APP_CONFIG.storageKeys.lectures, allL.filter(function(l) { return l.id !== item.id; }));
        }
      }
    } catch (e) {}

    return true;
  },

  // استرجاع عنصر من سلة المحذوفات إلى مكانه الأصلي
  restoreFromRecycleBin: async function(recycleRecord) {
    if (!recycleRecord || !recycleRecord.itemData) return false;
    var self = this;
    var type = recycleRecord.originalType || "book";
    var item = recycleRecord.itemData;

    if (type === "book") {
      await self.saveBook(item);
    } else {
      await self.saveLecture(item);
    }

    // حذفه من سلة المحذوفات
    await self.permanentDeleteFromRecycleBin(recycleRecord.id);

    // تحديث التخزين المحلي
    try {
      var utils = window.APP_UTILS;
      if (utils) {
        if (type === "book") {
          var allB = utils.getLocal(window.APP_CONFIG.storageKeys.books, []) || [];
          if (!allB.some(function(b) { return b.id === item.id; })) {
            allB.push(item);
            utils.setLocal(window.APP_CONFIG.storageKeys.books, allB);
          }
        } else if (type === "lecture") {
          var allL = utils.getLocal(window.APP_CONFIG.storageKeys.lectures, []) || [];
          if (!allL.some(function(l) { return l.id === item.id; })) {
            allL.unshift(item);
            utils.setLocal(window.APP_CONFIG.storageKeys.lectures, allL);
          }
        }
      }
    } catch (e) {}

    return true;
  },

  // حذف نهائي لا رجعة فيه لعنصر من السلة
  permanentDeleteFromRecycleBin: async function(recycleDocId) {
    if (!recycleDocId) return true;
    if (window.db) {
      try {
        await window.db.collection("recycle_bin").doc(recycleDocId).delete();
      } catch (err) {
        console.warn("permanentDeleteFromRecycleBin error:", err);
      }
    }
    try {
      var utils = window.APP_UTILS;
      if (utils) {
        var localBin = utils.getLocal("counsel_recycle_bin", []) || [];
        utils.setLocal("counsel_recycle_bin", localBin.filter(function(i) { return i.id !== recycleDocId; }));
      }
    } catch (e) {}
    return true;
  },

  // تفريغ سلة المحذوفات بالكامل
  emptyRecycleBin: async function() {
    var self = this;
    if (window.db) {
      try {
        var snap = await window.db.collection("recycle_bin").get();
        var batch = window.db.batch();
        snap.forEach(function(doc) {
          batch.delete(doc.ref);
        });
        await batch.commit();
      } catch (e) {
        console.warn("emptyRecycleBin batch error:", e);
      }
    }
    try {
      if (window.APP_UTILS) {
        window.APP_UTILS.setLocal("counsel_recycle_bin", []);
      }
    } catch (e) {}
    return true;
  }
};

// Module: services/geminiService.js
// خدمة استدعاء الذكاء الاصطناعي للتلخيص والبودكاست والمساعد الدراسي
window.GeminiAIService = {
  // مفتاح تخزين السحابة
  storageKey: "counsel_ai_api_key",

  // استخراج المفتاح من فايربيز أولاً أو التخزين المحلي الآمن
  getApiKey: async function() {
    try {
      if (window.db) {

        if (doc.exists && doc.data().apiKey) {
          return doc.data().apiKey.trim();
        }

    } catch (e) {}
    return window.APP_UTILS.getLocal(window.GeminiAIService.storageKey, "");
  },

  // حفظ المفتاح في السحابة ومحلياً
  saveApiKey: async function(key) {
    if (window.db) {
      await window.db.collection("settings").doc("ai_config").set({
        apiKey: key.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
    window.APP_UTILS.setLocal(window.GeminiAIService.storageKey, key.trim());
  },

  _cachedModels: null,

  // جلب النماذج المدعومة تلقائياً ومباشرة من حساب المستخدم (Auto Model Discovery)
  fetchSupportedModels: async function(key) {
    if (window.GeminiAIService._cachedModels && window.GeminiAIService._cachedModels.length > 0) {
      return window.GeminiAIService._cachedModels;
    }
    try {
      var listResp = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key=" + key);
      if (listResp.ok) {
        var listData = await listResp.json();
        if (listData.models && Array.isArray(listData.models)) {
          var models = listData.models
            .filter(function(m) {
              return m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent");
            })
            .map(function(m) {
              return m.name.replace(/^models\//, "");
            });
          
          if (models.length > 0) {
            // تفضيل نماذج flash الخفيفة والسريعة أولاً
            models.sort(function(a, b) {
              var aScore = (a.includes("2.0") ? 10 : 0) + (a.includes("flash") ? 5 : 0);
              var bScore = (b.includes("2.0") ? 10 : 0) + (b.includes("flash") ? 5 : 0);
              return bScore - aScore;
            });
            window.GeminiAIService._cachedModels = models;
            return models;
          }
        }
      }
    } catch (e) {
      console.warn("fetchSupportedModels error:", e);
    }
    return [];
  },

  // دالة الاستدعاء المباشر لنماذج جيميني مع الاكتشاف التلقائي الكامل (Auto)
  callGemini: async function(prompt, systemInstruction) {
    var key = await window.GeminiAIService.getApiKey();
    if (!key) {
      throw new Error("يرجى إدخال مفتاح واجهة برمجة التطبيقات في صفحة الإعدادات لحفظه سحابياً.");
    }

    var defaultInstruction = "أنت مساعد دراسي متخصص في دراسة ومناهج المشورة الإنسانية والنفسية. لغتك عربية نقية وواضحة، تقدم تحليلات عميقة وشروحات دقيقة تخدم الدارس وتساعده على الاستيعاب.";
    var instruction = systemInstruction || defaultInstruction;

    var body = {
      systemInstruction: {
        parts: [{ text: instruction }]
      },
      contents: [
        {
          role: "user",
          parts: [{ text: prompt }]
        }
      ],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 2048
      }
    };

    // اكتشاف النماذج المتاحة من حساب المستخدم تلقائياً
    var autoModels = await window.GeminiAIService.fetchSupportedModels(key);
    var candidateModels = autoModels.length > 0 ? autoModels : [
      "gemini-2.0-flash",
      "gemini-1.5-flash-latest",
      "gemini-1.5-flash-8b",
      "gemini-1.5-pro",
      "gemini-pro"
    ];

    var lastErrorMessage = "";

    for (var m = 0; m < candidateModels.length; m++) {
      var modelName = candidateModels[m];
      var url = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + key;

      try {
        var response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": key
          },
          body: JSON.stringify(body)
        });

        if (response.ok) {
          var data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
            return data.candidates[0].content.parts[0].text;
          }
        } else {
          var errData = await response.json().catch(function() { return {}; });
          var msg = (errData.error && errData.error.message) || "";
          var reason = (errData.error && errData.error.details && errData.error.details[0] && errData.error.details[0].reason) || "";
          if (response.status === 401 || response.status === 403 || reason === "API_KEY_SERVICE_BLOCKED" || msg.includes("API key not valid") || msg.includes("credentials")) {
            throw new Error("مفتاح الـ API غير مفعّل لخدمة Gemini في حساب جوجل (السبب: " + (reason || "غير مصرح") + "). يرجى إنشاء مفتاح مجاني جديد من Google AI Studio (aistudio.google.com).");
          }
          lastErrorMessage = msg || ("فشل الاستدعاء للنموذج " + modelName);
        }
      } catch (networkErr) {
        if (networkErr.message && networkErr.message.includes("مفتاح الـ API")) throw networkErr;
        lastErrorMessage = networkErr.message;
      }
    }

    throw new Error(lastErrorMessage || "تعذر العثور على نموذج متوافق مع هذا المفتاح");
  },

  // توليد حوار البودكاست التفاعلي بين شخصين
  generatePodcastDialogue: async function(lectureTitle, notesOrContent) {

// Module: services/notificationService.js
// خدمة الإشعارات السحابية وإشعارات المتصفح
window.NotificationService = {
  // تشغيل نغمة تنبيهية لطيفة وهزة بالجهاز عند وصول الإشعار
  playNotificationChime: function() {
    try {
      if (navigator.vibrate) {
        navigator.vibrate([250, 100, 250]);
      }
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();
      var now = ctx.currentTime;

      var osc1 = ctx.createOscillator();
      var gain1 = ctx.createGain();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(659.25, now); // E5
      gain1.gain.setValueAtTime(0.18, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.35);

      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(987.77, now + 0.12); // B5
      gain2.gain.setValueAtTime(0.22, now + 0.12);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now + 0.12);
      osc2.stop(now + 0.65);
    } catch(e) {}
  },

  // الاستماع للإشعارات الجديدة وعرضها للمستخدمين

// خدمة التقاط أخطاء النظام السحابية
window.ErrorReportService = {
  lastError: null,

  initGlobalErrorHandler: function() {
    window.onerror = function(message, source, lineno, colno, error) {
      window.ErrorReportService.lastError = {
        message: message,
        source: source,
        line: lineno,
        col: colno,
        stack: error ? error.stack : "",
        time: new Date().toISOString()
      };
      console.warn("Global error captured:", window.ErrorReportService.lastError);
    };

    window.addEventListener("unhandledrejection", function(event) {
      window.ErrorReportService.lastError = {
        message: event.reason ? (event.reason.message || event.reason) : "Unhandled Promise Rejection",
        stack: event.reason && event.reason.stack ? event.reason.stack : "",
        time: new Date().toISOString()
      };
      console.warn("Unhandled promise rejection captured:", window.ErrorReportService.lastError);
    });
  },

  // إرسال تقرير الخطأ إلى فايربيز
  sendReport: async function(reportData) {
    if (!window.db) throw new Error("قاعدة البيانات غير متصلة");
    var docId = "err_" + Date.now();
    var payload = Object.assign({}, reportData, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: "open" // 'open' or 'resolved'
    });
    return window.db.collection("error_reports").doc(docId).set(payload);
  },

  // رفع تسجيل صوتي للعطل إلى Firebase Storage
  uploadAudio: async function(audioBlob) {
    if (!window.storage) {
      console.warn("Storage not available, skipping audio upload");
      return null;
    }
    var ext = (audioBlob.type && audioBlob.type.indexOf("ogg") !== -1) ? "ogg" : "webm";
    var fileName = "error_audios/voice_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7) + "." + ext;
    var ref = window.storage.ref().child(fileName);
    var snapshot = await ref.put(audioBlob);
    var downloadUrl = await snapshot.ref.getDownloadURL();
    return {
      audioUrl: downloadUrl,
      storagePath: fileName
    };
  },

  // حذف تقرير والملف الصوتي المرتبط به
  deleteReport: async function(reportId, storagePath) {
    if (!window.db) return;
    try {
      if (storagePath && window.storage) {
        try {
          await window.storage.ref().child(storagePath).delete();
        } catch (e) {
          console.warn("Storage delete failed or file not found:", e);
        }
      }
      await window.db.collection("error_reports").doc(reportId).delete();
    } catch (err) {
      console.error("Delete report error:", err);
      throw err;
    }
  },

  // تنظيف تلقائي للبلاغات القديمة التي تم حلها ومر عليها 14 يوماً
  cleanupOldReports: async function() {
    if (!window.db) return;
    try {
      var twoWeeksAgo = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000);
      var snap = await window.db.collection("error_reports")
        .where("status", "==", "resolved")
        .get();
      
      var deletePromises = [];
      snap.forEach(function(doc) {
        var data = doc.data();
        var isOld = false;
        if (data.resolvedAt && typeof data.resolvedAt.toDate === "function") {
          isOld = data.resolvedAt.toDate() < twoWeeksAgo;
        } else if (data.createdAt && typeof data.createdAt.toDate === "function") {
          isOld = data.createdAt.toDate() < twoWeeksAgo;
        }
        if (isOld) {
          deletePromises.push(window.ErrorReportService.deleteReport(doc.id, data.audioStoragePath));
        }
      });
      if (deletePromises.length > 0) {
        await Promise.all(deletePromises);
        console.log("Cleaned up " + deletePromises.length + " old resolved error reports.");
      }
    } catch (e) {
      console.warn("Auto cleanup reports error:", e);
    }
  }
};

// Module: services/edgeTtsService.js
// خدمة تحويل النص إلى صوت (Text-to-Speech Service)
window.EdgeTtsService = {
  DEFAULT_VOICE: "ar-EG-SalmaNeural - ar-EG (Female)",
  API_ENDPOINT: "https://innoai-edge-tts-text-to-speech.hf.space/gradio_api/call/tts_interface",

  // توليد مقطع صوتي لنص معين
  generateAudioForText: async function(text, voiceKey, onProgress) {
    var self = this;
    var voice = voiceKey || self.DEFAULT_VOICE;
    var cleanedText = (text || "").trim();
    if (!cleanedText) {
      throw new Error("لا يوجد نص لتوليد الصوت منه.");
    }

    if (typeof onProgress === "function") {
      onProgress("جاري معالجة النص...");
    }

    // 1. استدعاء نقطة النهاية (Gradio Call Endpoint)
    var payload = {
      data: [
        cleanedText,
        voice,
        0, // Rate (السرعة الطبيعية)
        0  // Pitch (النبرة الطبيعية)
      ]
    };

    var postResp = await fetch(self.API_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (!postResp.ok) {
      throw new Error("فشل الاتصال بخدمة تحويل الصوت (" + postResp.status + ")");
    }

    var callData = await postResp.json();
    var eventId = callData.event_id;
    if (!eventId) {
      throw new Error("لم يتم استلام معرف العملية من السيرفر.");
    }

    if (typeof onProgress === "function") {
      onProgress("جاري إنشاء الملف الصوتي...");
    }

    // 2. الاستماع للنتيجة عبر مسار الحدث
    var sseUrl = self.API_ENDPOINT + "/" + eventId;
    var maxAttempts = 45; // أقصى مهلة 45 ثانية
    var audioUrl = null;

    for (var attempt = 0; attempt < maxAttempts; attempt++) {
      await new Promise(function(resolve) {
        setTimeout(resolve, 1000);
      });

      try {
        var sseResp = await fetch(sseUrl);
        if (!sseResp.ok) continue;
        var sseText = await sseResp.text();

        // فحص حدث الاكتمال
        if (sseText.indexOf("event: complete") !== -1 || sseText.indexOf("event: error") !== -1) {
          if (sseText.indexOf("event: error") !== -1) {
            throw new Error("حدث خطأ أثناء معالجة الصوت في السيرفر.");
          }

          // استخراج رابط الملف
          var matchUrl = sseText.match(/"url":\s*"([^"]+)"/);
          if (matchUrl && matchUrl[1]) {
            audioUrl = matchUrl[1];
          } else {
            var matchPath = sseText.match(/"path":\s*"([^"]+)"/);
            if (matchPath && matchPath[1]) {
              audioUrl = "https://innoai-edge-tts-text-to-speech.hf.space/gradio_api/file=" + matchPath[1];
            }
          }
          break;
        }
      } catch (pollErr) {
        if (pollErr.message && pollErr.message.indexOf("خطأ أثناء معالجة") !== -1) {
          throw pollErr;
        }
      }
    }

    if (!audioUrl) {
      throw new Error("استغرقت معالجة الصوت وقتاً أطول من المتوقع، يرجى المحاولة ثانية.");
    }

    return audioUrl;
  }
};

// دوال مساعدة عامة للتعامل مع التخزين المحلي، روابط جوجل درايف، وتنسيق الوقت
window.APP_UTILS = {
  // استخراج المعرف المباشر من رابط جوجل درايف
  extractDriveId: function(url) {
    if (!url) return "";
    var str = String(url).trim();
    var match = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    match = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    // إذا كان الرابط رابط ويب كامل وليس درايف (مثل Hugging Face, Firebase, أو رابط MP3 خارجي)، ليس درايف
    if (str.indexOf("http://") === 0 || str.indexOf("https://") === 0 || str.indexOf("blob:") === 0 || str.indexOf("data:") === 0) {
      return "";
    }
    // إذا كان معرف خام (Drive ID) بدون بروتوكول
    if (str.length >= 15 && str.length <= 60 && !/\s/.test(str)) {
      return str;
    }
    return "";
  },

  // تحويل رابط جوجل درايف إلى رابط تشغيل وتضمين مباشر
  getDrivePreviewUrl: function(driveIdOrUrl) {

    if (!id) return "";
    return "https://drive.google.com/file/d/" + id + "/preview";
  },

  // تحويل رابط جوجل درايف إلى رابط صورة مباشر وسريع لعرض الأغلفة (يدعم lh3 المباشر و thumbnail)
  getDriveImageUrl: function(driveIdOrUrl) {
    if (!driveIdOrUrl) return "";
    var str = String(driveIdOrUrl).trim();
    if (!str || str.startsWith("data:") || str.startsWith("blob:")) return str;
    var id = window.APP_UTILS.extractDriveId(str);

  // تنسيق الثواني إلى دقائق وثوانٍ
  formatDuration: function(seconds) {
    if (!seconds || isNaN(seconds)) return "00:00";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  },

  // تنسيق المدة الزمنية بنص عربي واضح ومريح للموبايل
  formatArabicDuration: function(seconds) {
    if (!seconds || isNaN(seconds) || seconds <= 0) return "0 ثانية";
    var totalSec = Math.round(seconds);
    var hours = Math.floor(totalSec / 3600);
    var mins = Math.floor((totalSec % 3600) / 60);
    var secs = totalSec % 60;
    if (hours > 0) {
      if (mins > 0) return hours + " ساعة و " + mins + " دقيقة";
      return hours + " ساعة";
    }
    if (mins > 0) {
      if (secs > 0) return mins + " دقيقة و " + secs + " ثانية";
      return mins + " دقيقة";
    }
    return secs + " ثانية";
  },

  // حفظ واسترجاع من التخزين المحلي
  getLocal: function(key, defaultValue) {

      var item = localStorage.getItem(key);
      return item ? JSON.parse(item) : defaultValue;
    } catch (e) {
      return defaultValue;
    }
  },

  setLocal: function(key, value) {

  // تخزين الملفات الكبيرة (PDFs) بدون إنترنت عبر IndexedDB

      }
      var req = indexedDB.open("counsel_offline_storage", 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("books_pdf")) {
          db.createObjectStore("books_pdf", { keyPath: "bookId" });
        }
      };
      req.onsuccess = function(e) { resolve(e.target.result); };
      req.onerror = function(e) { reject(e.target.error); };

  saveOfflinePdf: async function(bookId, blobData) {

        var req = store.put({ bookId: bookId, data: blobData, savedAt: Date.now() });
        req.onsuccess = function() { resolve(true); };

  getOfflinePdf: async function(bookId) {

      return new Promise(function(resolve, reject) {

        var store = tx.objectStore("books_pdf");
        var req = store.get(bookId);
        req.onsuccess = function(e) {
          if (e.target.result && e.target.result.data) {

        };
        req.onerror = function() { resolve(null); };

  removeOfflinePdf: async function(bookId) {

      return false;
    }
  },

  // التحقق مما إذا كان الفصل مكتملاً استخراجه بالكامل
  isChapterComplete: function(c, nextChap) {
    if (!c || !c.text || c.text.trim().length < 30) return false;
    if (c.isComplete) return true;
    var sP = Number(c.startPage) || 1;
    var eP = Number(c.endPage) || 0;
    if (!eP && nextChap && nextChap.startPage) {
      eP = Math.max(sP, Number(nextChap.startPage) - 1);
    }
    if (!eP) eP = sP;
    var lastP = Number(c.lastExtractedPage);
    // السماح بنقص صفحة واحدة في النهاية إذا كان الفصل يحتوي على نص كبير (نظراً لأن الصفحة الأخيرة غالباً ما تكون بيضاء أو بها فاصل)
    if (lastP && eP && lastP < (eP - 1)) return false;
    if (eP > sP) {
      if (lastP && lastP >= (eP - 1)) return true;
      var totalPages = eP - sP + 1;
      if (c.text.trim().length < Math.min(1000, totalPages * 50)) return false;
    }
    return true;
  },

  // كاش النصوص المستخرجة لكل صفحة لتوفير الـ Quota وتسريع الاستئناف الفوري
  getCachedPageText: function(bookId, pageNum) {
    if (!bookId || !pageNum) return null;
    try {
      var key = "counsel_ocr_p_" + bookId + "_" + pageNum;
      var cached = localStorage.getItem(key);
      if (cached && cached.trim()) return cached;
    } catch (e) {}
    return null;
  },

  setCachedPageText: function(bookId, pageNum, text) {
    if (!bookId || !pageNum || !text) return;
    try {
      var key = "counsel_ocr_p_" + bookId + "_" + pageNum;
      localStorage.setItem(key, text);
    } catch (e) {}
  },

  // تدقيق وفحص سلامة الكتاب وفصوله إلزامياً قبل النشر للدارسين (Quality Gate)
  auditBookQuality: function(book) {
    if (!book) return { isPublishable: false, score: 0, issues: ["الكتاب غير محدد"], chaptersAudit: [] };
    var chaps = book.audioChapters || [];
    if (chaps.length === 0) {
      return { isPublishable: false, score: 0, issues: ["لا توجد فصول مضافة في هذا الكتاب"], chaptersAudit: [] };
    }

    var totalChapters = chaps.length;
    var completedCount = 0;
    var audioReadyCount = 0;
    var readyCount = 0;
    var publishedCount = 0;
    var overrideCount = 0;
    var chaptersAudit = [];
    var globalIssues = [];
    var totalPagesInBook = 0;
    var totalExtractedPages = 0;
    var bookIsPublished = !!(book.publishStatus === "published" || book.isPublished === true);

    for (var i = 0; i < chaps.length; i++) {
      var c = chaps[i];
      var sP = Number(c.startPage) || 1;
      var eP = Number(c.endPage) || sP;
      var totalPages = Math.max(1, eP - sP + 1);
      totalPagesInBook += totalPages;

      var lastP = Number(c.lastExtractedPage) || (c.isComplete ? eP : 0);
      var textLen = (c.text || "").trim().length;
      var hasAudio = !!(c.audioUrl && c.audioUrl.trim());
      if (hasAudio) audioReadyCount++;

      var pagesDone = 0;
      if (c.isComplete || lastP >= eP) {
        pagesDone = totalPages;
      } else if (lastP >= sP) {
        pagesDone = Math.min(totalPages, lastP - sP + 1);
      }
      totalExtractedPages += pagesDone;

      var isDenseEnough = textLen >= (totalPages * 400);
      var isComplete = (pagesDone >= totalPages) && (textLen > 100);
      if (isComplete) completedCount++;

      var adminOverride = !!c.adminOverride;
      if (adminOverride) overrideCount++;

      var isReady = (isComplete && hasAudio) || adminOverride;
      if (isReady) readyCount++;

      var isChapPublished = (c.isPublished === true) || (bookIsPublished && c.isPublished !== false);
      if (isChapPublished) publishedCount++;

      var chapIssues = [];
      if (!adminOverride) {
        if (pagesDone === 0) {
          chapIssues.push("لم يتم استخراج نصوص هذا الفصل نهائياً");
        } else if (pagesDone < totalPages) {
          chapIssues.push("مستخرج جزئياً فقط (" + pagesDone + " من " + totalPages + " صفحة - متبقي " + (totalPages - pagesDone) + " صفحة)");
        } else if (!isDenseEnough && totalPages > 1) {
          chapIssues.push("حجم النص قليل جداً مقارنة بعدد صفحات الفصل (" + textLen + " حرف لـ " + totalPages + " صفحة)");
        }

        if (!hasAudio) {
          chapIssues.push("لا يوجد تسجيل صوتي (MP3) لهذا الفصل بعد");
        }
      }

      chaptersAudit.push({
        id: c.id,
        index: i + 1,
        title: c.title,
        startPage: sP,
        endPage: eP,
        totalPages: totalPages,
        pagesDone: pagesDone,
        percent: Math.round((pagesDone / totalPages) * 100),
        textLen: textLen,
        hasAudio: hasAudio,
        audioDuration: c.audioDuration || 0,
        isComplete: isComplete,
        adminOverride: adminOverride,
        isReady: isReady,
        isPublished: isChapPublished,
        issues: chapIssues
      });
    }

    if (completedCount < totalChapters) {
      globalIssues.push("يوجد " + (totalChapters - completedCount) + " فصول غير مكتملة النص.");
    }
    if (audioReadyCount < totalChapters) {
      globalIssues.push("يوجد " + (totalChapters - audioReadyCount) + " فصول ينقصها التسجيل الصوتي.");
    }

    var isPublishable = (readyCount === totalChapters) && (totalChapters > 0);
    var isPartiallyPublishable = (readyCount > 0);
    var overallPercent = Math.round((totalExtractedPages / Math.max(1, totalPagesInBook)) * 100);

    return {
      isPublishable: isPublishable,
      isPartiallyPublishable: isPartiallyPublishable,
      totalChapters: totalChapters,
      completedCount: completedCount,
      audioReadyCount: audioReadyCount,
      readyCount: readyCount,
      publishedCount: publishedCount,
      overrideCount: overrideCount,
      totalPagesInBook: totalPagesInBook,
      totalExtractedPages: totalExtractedPages,
      overallPercent: overallPercent,
      globalIssues: globalIssues,
      chaptersAudit: chaptersAudit
    };
  },

  // دالة رفع الملفات إلى درايف مع حساب دقيق لنسبة التحميل المئوية وشريط التقدم
  uploadToDriveWithProgress: function(endpoint, file, onProgress, customFileName) {
    return new Promise(function(resolve, reject) {
      if (!file) return reject(new Error("No file provided"));
      var fileName = customFileName || file.name;
      var totalFileSizeMB = (file.size / (1024 * 1024)).toFixed(1);

      if (onProgress) {
        onProgress({
          percent: 5,
          loadedMB: "0.0",
          totalMB: totalFileSizeMB,
          stage: "reading",
          message: "⏳ جاري قراءة وتجهيز الملف (" + totalFileSizeMB + " MB)..."
        });
      }

      var reader = new FileReader();
      reader.onprogress = function(e) {
        if (e.lengthComputable && onProgress) {
          var rPct = Math.min(15, Math.max(5, Math.round((e.loaded / e.total) * 15)));
          onProgress({
            percent: rPct,
            loadedMB: (e.loaded / (1024 * 1024)).toFixed(1),
            totalMB: totalFileSizeMB,
            stage: "reading",
            message: "⏳ جاري قراءة الملف وتجهيزه: " + Math.round((e.loaded / e.total) * 100) + "%"
          });
        }
      };

      reader.onerror = function(err) {
        reject(err);
      };

      reader.onload = function() {
        var result = reader.result;
        var base64 = typeof result === "string" && result.includes(",") ? result.split(",")[1] : result;

        if (onProgress) {
          onProgress({
            percent: 15,
            loadedMB: "0.0",
            totalMB: totalFileSizeMB,
            stage: "uploading",
            message: "🚀 بدء الرفع السحابي (0%)..."
          });
        }

        var payload = JSON.stringify({
          fileName: fileName,
          mimeType: file.type || "application/pdf",
          base64Data: base64
        });

        if (onProgress) {
          onProgress({
            percent: 30,
            loadedMB: (totalFileSizeMB * 0.3).toFixed(1),
            totalMB: totalFileSizeMB,
            stage: "uploading",
            message: "🚀 جاري الرفع السحابي إلى Google Drive..."
          });
        }

        fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        })
        .then(function(res) {
          if (!res.ok) throw new Error("Server returned status " + res.status);
          return res.json();
        })
        .then(function(data) {
          if (onProgress) {
            onProgress({
              percent: 100,
              loadedMB: totalFileSizeMB,
              totalMB: totalFileSizeMB,
              stage: "done",
              message: "🎉 اكتمل الرفع والحفظ بنجاح!"
            });
          }
          resolve(data);
        })
        .catch(function(err) {
          reject(new Error("Network error during file upload: " + (err && err.message ? err.message : String(err))));
        });
      };

      reader.readAsDataURL(file);
    });
  },

  // رفع ملف صوتي من رابط URL مؤقت إلى Google Drive تلقائياً لحفظه دائماً وملكاً للمستخدم
  // رفع ملف صوتي من رابط URL مؤقت إلى Google Drive تلقائياً لحفظه دائماً وملكاً للمستخدم
  uploadAudioUrlToDrive: async function(audioUrl, customFileName, onStatus) {
    if (!audioUrl || typeof audioUrl !== "string") return audioUrl;
    if (audioUrl.indexOf("drive.google.com") !== -1 || audioUrl.indexOf("lh3.googleusercontent.com") !== -1 || audioUrl.indexOf("docs.google.com") !== -1) {
      return audioUrl;
    }
    try {
      if (typeof onStatus === "function") {
        onStatus("جاري نقل وحفظ الصوت تلقائياً إلى Google Drive الخاص بك...");
      }

      // جلب الملف الصوتي عبر بروكسي السيرفر لتخطي قيود CORS للمتصفحات والموبايل وفحص الحزم
      var b64Param = "";
      try {
        b64Param = (typeof btoa === "function") ? btoa(audioUrl) : "";
      } catch (eB) {}
      var proxyUrl = b64Param ? ("/api/download-audio?b64=" + encodeURIComponent(b64Param)) : ("/api/download-audio?url=" + encodeURIComponent(audioUrl));
      var resp = null;
      try {
        resp = await fetch(proxyUrl);
      } catch (eProxy) {
        console.warn("Proxy download attempt error, falling back to direct fetch:", eProxy);
      }

      if (!resp || !resp.ok) {
        resp = await fetch(audioUrl);
      }

      if (!resp.ok) {
        throw new Error("تعذر تحميل الملف الصوتي من السيرفر المصدر (" + resp.status + ")");
      }

      var blob = await resp.blob();
      var rawName = customFileName || ("audio_" + Date.now());
      var cleanFileName = rawName.replace(new RegExp("[\\\\/:*?\"<>|]", "g"), "_") + ".mp3";
      var audioFile = new File([blob], cleanFileName, { type: "audio/mp3" });

      var endpoint = window.APP_CONFIG && window.APP_CONFIG.driveUploadEndpoint;
      if (!endpoint) {
        throw new Error("رابط رفع جوجل درايف غير معرف في إعدادات التطبيق.");
      }

      var resData = await window.APP_UTILS.uploadToDriveWithProgress(endpoint, audioFile, null, cleanFileName);
      if (resData && (resData.fileUrl || resData.fileId)) {
        var finalDriveUrl = resData.fileUrl || ("https://drive.google.com/file/d/" + resData.fileId + "/view");
        console.log("Successfully auto-uploaded audio to Google Drive permanently:", finalDriveUrl);
        return finalDriveUrl;
      } else {
        throw new Error("لم يتم استلام رابط تأكيد الحفظ من Google Drive.");
      }
    } catch (err) {
      console.error("Critical: Failed to upload audio to Google Drive:", err);
      // حظر قاطع لحفظ أي روابط مؤقتة لتجنب موتها بعد ساعات
      throw new Error("فشل تأمين الملف الصوتي بشكل دائم على Google Drive: " + (err.message || err));
    }
  },

  // ضغط وتصغير صور الأغلفة تلقائياً لمنع أي تضخم أو بطء في قاعدة البيانات
  compressImageFile: function(file, maxWidth, maxHeight, quality) {
    maxWidth = maxWidth || 450;
    maxHeight = maxHeight || 650;
    quality = quality || 0.75;

    return new Promise(function(resolve, reject) {
      if (!file || !file.type || file.type.indexOf("image/") === -1) {
        resolve(null);
        return;
      }

      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var width = img.width;
          var height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          var canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          // تصدير كـ JPEG خفيف ومضغوط جداً بحجم مثالي لا يتجاوز 25-30 كيلوبايت
          var compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve(compressedDataUrl);
        };
        img.onerror = function() {
          resolve(e.target.result);
        };
        img.src = e.target.result;
      };
      reader.onerror = function(err) {
        reject(err);
      };
      reader.readAsDataURL(file);
    });
  },

  // استخراج وتفكيك بيانات دعوة زوم الذكية من نص رسالة الواتساب
  parseZoomInvitation: function(rawText) {
    if (!rawText || typeof rawText !== "string") {
      return { zoomUrl: "", meetingId: "", passcode: "", topic: "", timeStr: "" };
    }
    var text = rawText.trim();

    // 1. استخراج رابط زوم (الرابط الأساسي Join Zoom Meeting)
    var zoomUrl = "";
    var urlMatch = text.match(/https?:\/\/[a-zA-Z0-9_\.-]*zoom\.us\/j\/[^\s\<\>"\']+/i);
    if (urlMatch && urlMatch[0]) {
      zoomUrl = urlMatch[0].trim();
      // تنظيف أي نقطة أو فاصلة في نهاية الرابط بالخطأ ما لم تكن جزءاً من رمز pwd
      if (zoomUrl.endsWith(".") && !zoomUrl.includes("pwd=")) {
        zoomUrl = zoomUrl.slice(0, -1);
      }
    }

    // 2. استخراج Meeting ID
    var meetingId = "";
    var idMatch = text.match(/Meeting\s*ID[:\s]*([0-9\s]{9,15})/i) ||
                  text.match(/معرف\s*(الاجتماع|اللقاء)[:\s]*([0-9\s]{9,15})/i) ||
                  text.match(/\/j\/([0-9]{9,12})/i);
    if (idMatch) {
      meetingId = (idMatch[1] || idMatch[2] || "").trim();
    }

    // 3. استخراج Passcode
    var passcode = "";
    var passMatch = text.match(/Passcode[:\s]*([a-zA-Z0-9]+)/i) ||
                    text.match(/كلمة\s*(المرور|السر)[:\s]*([a-zA-Z0-9]+)/i) ||
                    text.match(/رمز\s*(المرور|الدخول)[:\s]*([a-zA-Z0-9]+)/i);
    if (passMatch) {
      passcode = (passMatch[1] || "").trim();
    }

    // 4. استخراج Topic (الموضوع)
    var topic = "";
    var topicMatch = text.match(/Topic[:\s]*([^\r\n]+)/i) ||
                     text.match(/الموضوع[:\s]*([^\r\n]+)/i);
    if (topicMatch && topicMatch[1]) {
      topic = topicMatch[1].trim();
    }

    // 5. استخراج التوقيت المكتوب إن وُجد
    var timeStr = "";
    var timeMatch = text.match(/Time[:\s]*([^\r\n]+)/i) ||
                    text.match(/الموعد[:\s]*([^\r\n]+)/i);
    if (timeMatch && timeMatch[1]) {
      timeStr = timeMatch[1].trim();
    }

    return {
      zoomUrl: zoomUrl,
      meetingId: meetingId,
      passcode: passcode,
      topic: topic,
      timeStr: timeStr
    };
  }
};

// دالة استخراج وتضمين يوتيوب أو جوجل درايف
window.APP_UTILS.getMediaEmbedUrl = function(url) {
  if (!url) return "";
  // فحص يوتيوب
  var ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
  if (ytMatch && ytMatch[1]) {
    return "https://www.youtube.com/embed/" + ytMatch[1];
  }
  // فحص جوجل درايف
  var driveId = window.APP_UTILS.extractDriveId(url);
  if (driveId) {
    return "https://drive.google.com/file/d/" + driveId + "/preview";
  }
  return url;
};

// مكون React Error Boundary لمنع الصفحة البيضاء واصطياد أي عطل مفاجئ
window.ErrorBoundary = class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = {
      hasError: false,
      error: null,
      errorInfo: null,
      isSending: false,
      sentSuccess: false,
      isRecording: false,
      audioBlob: null,
      audioUrl: null,
      recordingDuration: 0
    };
    this.mediaRecorder = null;
    this.audioChunks = [];
    this.timerInterval = null;
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error: error };
  }

  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught an unhandled error:", error, errorInfo);
    this.setState({ errorInfo: errorInfo });
    if (window.ErrorReportService) {
      window.ErrorReportService.lastError = {
        message: error ? (error.message || String(error)) : "Unknown Render Error",
        stack: (error && error.stack) ? error.stack : (errorInfo ? errorInfo.componentStack : ""),
        time: new Date().toISOString()
      };
    }
  }

  startRecording = async () => {
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.mediaRecorder = new MediaRecorder(stream);
      this.audioChunks = [];
      var self = this;

      this.mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) {
          self.audioChunks.push(e.data);
        }
      };

      this.mediaRecorder.onstop = function() {
        var blob = new Blob(self.audioChunks, { type: "audio/webm" });
        var url = URL.createObjectURL(blob);
        self.setState({ audioBlob: blob, audioUrl: url, isRecording: false });
        stream.getTracks().forEach(function(track) { track.stop(); });
      };

      this.mediaRecorder.start();
      this.setState({ isRecording: true, recordingDuration: 0, audioBlob: null, audioUrl: null });

      this.timerInterval = setInterval(function() {
        self.setState(function(prev) { return { recordingDuration: prev.recordingDuration + 1 }; });
      }, 1000);
    } catch (err) {
      alert("تعذر الوصول للميكروفون: " + err.message);
    }
  };

  stopRecording = () => {
    if (this.mediaRecorder && this.state.isRecording) {
      this.mediaRecorder.stop();
      if (this.timerInterval) clearInterval(this.timerInterval);
    }
  };

  handleSendCrashReport = async () => {
    this.setState({ isSending: true });
    try {
      var audioData = null;
      if (this.state.audioBlob && window.ErrorReportService.uploadAudio) {
        audioData = await window.ErrorReportService.uploadAudio(this.state.audioBlob);
      }

      var hash = window.location.hash || "#unknown";
      var errText = "الرسالة: " + (this.state.error ? this.state.error.message : "خطأ غير معروف") + "\n" +
        "Stack: " + (this.state.error && this.state.error.stack ? this.state.error.stack : "") + "\n" +
        "ComponentStack: " + (this.state.errorInfo ? this.state.errorInfo.componentStack : "");

      await window.ErrorReportService.sendReport({
        page: "انهيار كلي (" + hash + ")",
        userDescription: "انهيار مفاجئ للشاشة تم الإبلاغ عنه من شاشة الخطأ التلقائية",
        errorDetails: errText,
        senderName: (this.props.currentUser && this.props.currentUser.fullName) || "مستخدم غير مسجل",
        senderPhone: (this.props.currentUser && this.props.currentUser.phone) || "-",
        senderEmail: (this.props.currentUser && this.props.currentUser.email) || "-",
        deviceInfo: navigator.userAgent,
        audioUrl: audioData ? audioData.audioUrl : null,
        audioStoragePath: audioData ? audioData.storagePath : null
      });

      this.setState({ sentSuccess: true, isSending: false });
      var self = this;
      setTimeout(function() {
        self.handleRecover();
      }, 2000);
    } catch (err) {
      alert("فشل إرسال البلاغ: " + err.message);
      this.setState({ isSending: false });
    }
  };

  handleRecover = () => {
    try {
      window.location.hash = "#lectures";
      localStorage.setItem("counsel_active_tab", "lectures");
    } catch (e) {}
    this.setState({ hasError: false, error: null, errorInfo: null, sentSuccess: false });
    window.location.reload();
  };

  render() {
    if (!this.state.hasError) {
      return this.props.children;
    }

    var self = this;
    var durationSec = this.state.recordingDuration;
    var minutes = Math.floor(durationSec / 60);
    var seconds = durationSec % 60;
    var timeFormatted = (minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds);

    return React.createElement(
      "div",
      { className: "min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4 font-cairo", dir: "rtl" },
      React.createElement(
        "div",
        { className: "bg-slate-800/90 border border-slate-700 max-w-lg w-full rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-md text-center space-y-6" },
        
        React.createElement("div", { className: "w-20 h-20 mx-auto rounded-3xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-4xl shadow-inner animate-pulse" }, "⚠️"),
        
        React.createElement(
          "div",
          { className: "space-y-2" },
          React.createElement("h2", { className: "text-xl sm:text-2xl font-bold text-white" }, "عذراً، حدث خطأ غير متوقع بالصفحة"),
          React.createElement("p", { className: "text-xs sm:text-sm text-slate-300 leading-relaxed" },

          )
        ),

        // قسم التسجيل الصوتي
        React.createElement(
          "div",
          { className: "p-4 bg-slate-900/60 rounded-2xl border border-slate-700/60 space-y-3 text-right" },
          React.createElement("div", { className: "flex items-center justify-between" },
            React.createElement("span", { className: "text-xs font-bold text-slate-300 flex items-center gap-1.5" },
              React.createElement("span", null, "🎙️"),
              "تسجيل فويس سريع يشرح المشكلة (اختياري)"
            ),
            this.state.isRecording ? React.createElement("span", { className: "text-xs text-rose-400 font-bold animate-pulse" }, "● جاري التسجيل: " + timeFormatted) : null
          ),
          
          React.createElement(
            "div",

              type: "button",

            }, "بدء التسجيل الصوتي 🎙️") : React.createElement("button", {

          ) : null
        ),

        this.state.sentSuccess ? React.createElement(

        ) : React.createElement(
          "div",
          { className: "flex flex-col sm:flex-row items-center gap-3 pt-2" },

  var audioChunksRef = React.useRef([]);
  var timerRef = React.useRef(null);

  React.useEffect(function() {
    if (isOpen) {
      var last = window.ErrorReportService.lastError;
      if (last) {
        setCapturedErrorCode(
          "الرسالة: " + last.message + "\n" +
          "الملف: " + (last.source || "غير محدد") + " (سطر: " + (last.line || "-") + ")\n" +
          "التتبع: " + (last.stack || "")
        );
      } else {
        setCapturedErrorCode("لم يتم تسجيل انهيار تلقائي؛ تم فتح النموذج يدوياً من الشاشة: " + activeTab);
      }
      setReportType("bug");
      setUserDescription("");
      setSuccessNotice(false);
      setIsRecording(false);
      setAudioBlob(null);
      setAudioUrl(null);
      setRecordingDuration(0);
    }
  }, [isOpen, activeTab]);

  React.useEffect(function() {
    return function() {
      if (timerRef.current) clearInterval(timerRef.current);
      if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
        mediaRecorderRef.current.stop();
      }
    };
  }, []);

  if (!isOpen) return null;

  var startRecording = async function() {
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      if (typeof fileOrBase64 === "string" && fileOrBase64.indexOf("data:") === 0) {
        base64Data = fileOrBase64.indexOf(",") !== -1 ? fileOrBase64.split(",")[1] : fileOrBase64;

          reader.onerror = reject;
          reader.readAsDataURL(fileOrBase64);
        });
        mimeType = fileOrBase64.type || "image/jpeg";
        fileName = fileOrBase64.name || fileName;
        base64Data = (typeof rawData === "string" && rawData.indexOf(",") !== -1) ? rawData.split(",")[1] : rawData;
      } else {
        return fileOrBase64;
      }

      // محاولة الرفع السحابي عبر Drive إن وُجد للحصول على رابط دائم
      if (cfg && cfg.driveUploadEndpoint) {
        try {
          var response = await fetch(cfg.driveUploadEndpoint, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },

      return (typeof fileOrBase64 === "string") ? fileOrBase64 : ("data:" + mimeType + ";base64," + base64Data);

      console.warn("Error uploading cover image:", err);

    if (parts.length === 3) {
      var h = parseInt(parts[0]) || 0;
      var m2 = parseInt(parts[1]) || 0;

      return (h * 3600) + (m2 * 60) + s2;

  // دالة مساعدة قوية لاستخراج نص صفحة مفردة مع معالجة الـ Rate Limit وإعادة المحاولة

      "1. استبعاد أرقام الصفحات نهائياً: لا تقم بكتابة أي رقم صفحة مطبوع في الهوامش أو أسفل الصفحة أو أعلاها إطلاقاً (سواء كان رقماً عربياً مشرقياً مثل ٧، ٨، ٩ أو غربياً مثل 7, 8, 9).\n" +
      "2. استبعاد ترويسة وهوامش الصفحة المتكررة (Running Headers/Footers): مثل تكرار اسم الكتاب أو عنوان الفصل المطبوع في أعلى أو أسفل كل ورقة، استبعدها وتجاهلها.\n" +
      "3. استخرج صلب ومتن الكلام فقط بتدفقه السليم حتى يقرأه المعلق الصوتي بسلاسة بدون انقطاع.\n" +

    var lastErr = null;
    for (var mi = 0; mi < candidateModels.length; mi++) {

        try {
          var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + key, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

  // دالة تنقية النص من أرقام الصفحات
  var cleanTextRegex = function(txt) {
    if (!txt) return "";

    lines = lines.filter(function(line) {
      var trimmed = line.trim();
      if (!trimmed) return true;

  // التنفيذ الفعلي لاستخراج فصل مفرد بعد ضبط الإعدادات
