// Module: services/cloudSync.js
// خدمة المزامنة السحابية اللحظية مع فايربيز
window.CloudSyncService = {
  // الاشتراك اللحظي في المحاضرات
  subscribeLectures: function(onUpdate) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("lectures").orderBy("date", "desc").onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        onUpdate(list);
      }, function(err) {
        console.warn("Firestore lectures read fallback to local:", err);
      });
    } catch (e) {
      return function() {};
    }
  },

  // حفظ أو تعديل محاضرة سحابياً
  saveLecture: function(lecture) {
    if (!window.db) return Promise.resolve();
    var docId = lecture.id || ("lec-" + Date.now());
    var data = Object.assign({}, lecture, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return window.db.collection("lectures").doc(docId).set(data, { merge: true });
  },

  // حفظ موضع الاستماع فقط (ثانية التوقف) لتوفير الباندويث
  updatePlaybackPosition: function(lectureId, seconds) {
    if (!window.db || !lectureId) return Promise.resolve();
    return window.db.collection("lectures").doc(lectureId).set({
      lastPosition: seconds,
      lastPlayedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  },

  // الاشتراك اللحظي في الكتب
  subscribeBooks: function(onUpdate) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("books").onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        onUpdate(list);
      });
    } catch (e) {
      return function() {};
    }
  },

  // حفظ أو تعديل كتاب
  saveBook: function(book) {
    if (!window.db) return Promise.resolve();
    var docId = book.id || ("book-" + Date.now());
    return window.db.collection("books").doc(docId).set(book, { merge: true });
  },

  // حفظ موضع الصفحة فقط في الكتاب
  updateBookPage: function(bookId, page) {
    if (!window.db || !bookId) return Promise.resolve();
    return window.db.collection("books").doc(bookId).set({
      currentPage: page
    }, { merge: true });
  },

  // حفظ واسترجاع نصوص الصفحات المستخرجة بالذكاء الاصطناعي (Cloud Cache لتوفير الـ Quota)
  saveCachedPageText: function(bookId, pageNum, text) {
    if (!window.db || !bookId || !pageNum || !text) return Promise.resolve();
    return window.db.collection("books").doc(bookId).collection("cached_pages").doc("p_" + pageNum).set({
      page: pageNum,
      text: text,
      cachedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  },

  getCachedPageText: async function(bookId, pageNum) {
    if (!window.db || !bookId || !pageNum) return null;
    try {
      var doc = await window.db.collection("books").doc(bookId).collection("cached_pages").doc("p_" + pageNum).get();
      if (doc.exists && doc.data() && doc.data().text) {
        return doc.data().text;
      }
    } catch (e) {
      console.warn("getCachedPageText error:", e);
    }
    return null;
  },

  // الاشتراك في الملاحظات الدراسية
  subscribeNotes: function(onUpdate) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("personal_notes").orderBy("date", "desc").onSnapshot(function(snapshot) {
        var list = [];
        snapshot.forEach(function(doc) {
          list.push(Object.assign({ id: doc.id }, doc.data()));
        });
        onUpdate(list);
      });
    } catch (e) {
      return function() {};
    }
  },

  saveNote: function(note) {
    if (!window.db) return Promise.resolve();
    var docId = note.id || ("note-" + Date.now());
    return window.db.collection("personal_notes").doc(docId).set(note, { merge: true });
  },

  // حذف مستند عام من أي مجموعة (Collection)
  deleteDocument: async function(collectionName, docId) {
    if (!window.db || !collectionName || !docId) return true;
    try {
      await window.db.collection(collectionName).doc(docId).delete();
      return true;
    } catch (e) {
      console.error("Firestore deleteDocument error:", e);
      throw e;
    }
  },

  // حذف كتاب
  deleteBook: async function(bookId) {
    return this.deleteDocument("books", bookId);
  }
};

// Module: services/geminiService.js
// خدمة استدعاء الذكاء الاصطناعي للتلخيص والبودكاست والمساعد الدراسي
window.GeminiAIService = {
  // مفتاح تخزين السحابة
  storageKey: "counsel_ai_api_key",

  // استخراج المفتاح من فايربيز أولاً أو التخزين المحلي الآمن
  getApiKey: async function() {
    try {
      if (window.db) {
        var doc = await window.db.collection("settings").doc("ai_config").get();
        if (doc.exists && doc.data().apiKey) {
          return doc.data().apiKey.trim();
        }
      }
    } catch (e) {}
    return window.APP_UTILS.getLocal(window.GeminiAIService.storageKey, "");
  },

  // حفظ المفتاح في السحابة ومحلياً
  saveApiKey: async function(key) {
    if (window.db) {
      await window.db.collection("settings").doc("ai_config").set({
        apiKey: key.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
    window.APP_UTILS.setLocal(window.GeminiAIService.storageKey, key.trim());
  },

  _cachedModels: null,

  // جلب النماذج المدعومة تلقائياً ومباشرة من حساب المستخدم (Auto Model Discovery)
  fetchSupportedModels: async function(key) {
    if (window.GeminiAIService._cachedModels && window.GeminiAIService._cachedModels.length > 0) {
      return window.GeminiAIService._cachedModels;
    }
    try {
      var listResp = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key=" + key);
      if (listResp.ok) {
        var listData = await listResp.json();
        if (listData.models && Array.isArray(listData.models)) {
          var models = listData.models
            .filter(function(m) {
              return m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent");
            })
            .map(function(m) {
              return m.name.replace(/^models\//, "");
            });
          
          if (models.length > 0) {
            // تفضيل نماذج flash الخفيفة والسريعة أولاً
            models.sort(function(a, b) {
              var aScore = (a.includes("2.0") ? 10 : 0) + (a.includes("flash") ? 5 : 0);
              var bScore = (b.includes("2.0") ? 10 : 0) + (b.includes("flash") ? 5 : 0);
              return bScore - aScore;
            });
            window.GeminiAIService._cachedModels = models;
            return models;
          }
        }
      }
    } catch (e) {
      console.warn("fetchSupportedModels error:", e);
    }
    return [];
  },

  // دالة الاستدعاء المباشر لنماذج جيميني مع الاكتشاف التلقائي الكامل (Auto)
  callGemini: async function(prompt, systemInstruction) {
    var key = await window.GeminiAIService.getApiKey();
    if (!key) {
      throw new Error("يرجى إدخال مفتاح واجهة برمجة التطبيقات في صفحة الإعدادات لحفظه سحابياً.");
    }

    var defaultInstruction = "أنت مساعد دراسي متخصص في دراسة ومناهج المشورة الإنسانية والنفسية. لغتك عربية نقية وواضحة، تقدم تحليلات عميقة وشروحات دقيقة تخدم الدارس وتساعده على الاستيعاب.";
    var instruction = systemInstruction || defaultInstruction;

    var body = {
      systemInstruction: {
        parts: [{ text: instruction }]
      },
      contents: [
        {
          role: "user",
          parts: [{ text: prompt }]
        }
      ],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 2048
      }
    };

    // اكتشاف النماذج المتاحة من حساب المستخدم تلقائياً
    var autoModels = await window.GeminiAIService.fetchSupportedModels(key);
    var candidateModels = autoModels.length > 0 ? autoModels : [
      "gemini-2.0-flash",
      "gemini-1.5-flash-latest",
      "gemini-1.5-flash-8b",
      "gemini-1.5-pro",
      "gemini-pro"
    ];

    var lastErrorMessage = "";

    for (var m = 0; m < candidateModels.length; m++) {
      var modelName = candidateModels[m];
      var url = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + key;

      try {
        var response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": key
          },
          body: JSON.stringify(body)
        });

        if (response.ok) {
          var data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
            return data.candidates[0].content.parts[0].text;
          }
        } else {
          var errData = await response.json().catch(function() { return {}; });
          var msg = (errData.error && errData.error.message) || "";
          var reason = (errData.error && errData.error.details && errData.error.details[0] && errData.error.details[0].reason) || "";
          if (response.status === 401 || response.status === 403 || reason === "API_KEY_SERVICE_BLOCKED" || msg.includes("API key not valid") || msg.includes("credentials")) {
            throw new Error("مفتاح الـ API غير مفعّل لخدمة Gemini في حساب جوجل (السبب: " + (reason || "غير مصرح") + "). يرجى إنشاء مفتاح مجاني جديد من Google AI Studio (aistudio.google.com).");
          }
          lastErrorMessage = msg || ("فشل الاستدعاء للنموذج " + modelName);
        }
      } catch (networkErr) {
        if (networkErr.message && networkErr.message.includes("مفتاح الـ API")) throw networkErr;
        lastErrorMessage = networkErr.message;
      }
    }

    throw new Error(lastErrorMessage || "تعذر العثور على نموذج متوافق مع هذا المفتاح");
  },

  // توليد حوار البودكاست التفاعلي بين شخصين
  generatePodcastDialogue: async function(lectureTitle, notesOrContent) {
    var prompt = "قم بإنشاء سيناريو حواري بودكاست تفاعلي ممتع بين شخصين (المحاور الأول: فادي، والمحاورة الثانية: سارة) لمناقشة وشرح موضوع: '" + lectureTitle + "'.\n" +
      "المحتوى والنقاط الأساسية:\n" + (notesOrContent || "أسس الفهم الإنساني والمشورة") + "\n\n" +
      "المطلوب: أخرج الحوار في شكل متبادل بين فادي وسارة بلغة عربية سلسلة وهادئة مناسبة للاستماع المباشر في أي وقت بأسلوب بودكاست طبيعي وإنساني بدون أي مقدمات نمطية أو روبوتية، يطرح فادي التساؤلات الواقعية وتجيب سارة بشرح أعمق وتطبيقات عملية ملموسة.";
    
    return await window.GeminiAIService.callGemini(prompt);
  },

  // توليد كبسولة مراجعة الامتحان
  generateExamSummary: async function(title, content) {
    var prompt = "استخرج كبسولة مراجعة سريعة ومركزة ليلة الامتحان للموضوع التالي: '" + title + "'.\n" +
      "المحتوى:\n" + (content || "") + "\n\n" +
      "المطلوب:\n" +
      "1. المفاهيم والتعريفات الجوهرية.\n" +
      "2. الفروق الدقيقة والمصطلحات الأساسية.\n" +
      "3. أسئلة متوقعة وأجوبتها النموذجية المختصرة.";
    
    return await window.GeminiAIService.callGemini(prompt);
  },

  // استخراج النص من صورة (لتحليل الـ PDF)
  extractTextFromImage: async function(base64Image) {
    var key = await window.GeminiAIService.getApiKey();
    if (!key) {
      throw new Error("يرجى إدخال مفتاح واجهة برمجة التطبيقات في الإعدادات لتفعيل القارئ الذكي.");
    }
    
    // إزالة البادئة إذا وجدت (data:image/jpeg;base64,)
    var cleanBase64 = base64Image;
    if (cleanBase64.indexOf("base64,") !== -1) {
      cleanBase64 = cleanBase64.split("base64,")[1];
    }
    
    var body = {
      contents: [
        {
          role: "user",
          parts: [
            { text: "قم باستخراج جميع النصوص العربية من هذه الصورة بدقة شديدة كما هي مكتوبة تماماً. احرص تماماً على كتابة الكلمات العربية متصلة وبشكل سليم ككلمات كاملة بدون أي مسافات بين حروف الكلمة الواحدة (بحيث تكون كلمات وجمل طبيعية صالحة للقراءة الصوتية وليست حروفاً متباعدة). قم بإرجاع النص المكتوب فقط بدون أي مقدمات أو تعليقات خارجية." },
            {
              inlineData: {
                mimeType: "image/jpeg",
                data: cleanBase64
              }
            }
          ]
        }
      ],
      generationConfig: {
        temperature: 0.1, // نحتاج لدقة الاستخراج وليس الإبداع
        maxOutputTokens: 2048
      }
    };
    
    // اكتشاف النماذج المتاحة من حساب المستخدم تلقائياً
    var autoModels = await window.GeminiAIService.fetchSupportedModels(key);
    var candidateModels = autoModels.length > 0 ? autoModels : [
      "gemini-2.0-flash",
      "gemini-1.5-flash-latest",
      "gemini-1.5-flash-8b",
      "gemini-1.5-pro",
      "gemini-pro"
    ];
    
    var lastError = "";
    for (var i = 0; i < candidateModels.length; i++) {
      var modelName = candidateModels[i];
      var url = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + key;
      try {
        var response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": key
          },
          body: JSON.stringify(body)
        });
        
        if (response.ok) {
          var data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
            return data.candidates[0].content.parts[0].text.trim();
          }
        } else {
          var errData = await response.json().catch(function() { return {}; });
          var msg = (errData.error && errData.error.message) || "";
          var reason = (errData.error && errData.error.details && errData.error.details[0] && errData.error.details[0].reason) || "";
          if (response.status === 401 || response.status === 403 || reason === "API_KEY_SERVICE_BLOCKED" || msg.includes("API key not valid") || msg.includes("credentials")) {
            throw new Error("مفتاح الـ API غير مفعّل لخدمة Gemini في حساب جوجل (السبب: " + (reason || "غير مصرح") + "). يرجى إنشاء مفتاح مجاني جديد من Google AI Studio (aistudio.google.com).");
          }
          lastError = msg || ("خطأ في نموذج " + modelName);
        }
      } catch (e) {
        if (e.message && e.message.includes("مفتاح الـ API")) throw e;
        lastError = e.message;
      }
    }
    
    throw new Error(lastError || "فشل قراءة الصورة بجميع نماذج الذكاء الاصطناعي");
  }
};

      });
      return true;
    }

  },

  // إرسال إشعار سحابي إلى فايربيز ليظهر لجميع الدارسين
  broadcastNewLectureNotification: async function(lecture) {
    if (!window.db) return;
    try {
      var notifData = {
        title: "🎙️ محاضرة جديدة: " + lecture.title,
        body: "ألقاها: " + lecture.speaker + " (تاريخ: " + lecture.date + ")",
        lectureId: lecture.id,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await window.db.collection("notifications").add(notifData);
    } catch (e) {
      console.warn("Could not broadcast notification:", e);
    }
  },

  // الاستماع للإشعارات الجديدة وعرضها للمستخدمين
  subscribeNotifications: function(onNewNotification) {
    if (!window.db) return function() {};
    try {
      return window.db.collection("notifications")
        .orderBy("createdAt", "desc")
        .limit(10)
        .onSnapshot(function(snapshot) {
          var list = [];
          snapshot.forEach(function(doc) {
            list.push(Object.assign({ id: doc.id }, doc.data()));
          });
          onNewNotification(list);
        });
    } catch (e) {
      return function() {};
    }
  }
};

// خدمة التقاط أخطاء النظام السحابية
window.ErrorReportService = {
  lastError: null,

  initGlobalErrorHandler: function() {
    window.onerror = function(message, source, lineno, colno, error) {
      window.ErrorReportService.lastError = {
        message: message,
        source: source,
        line: lineno,
        col: colno,
        stack: error ? error.stack : "",
        time: new Date().toISOString()
      };
      console.warn("Global error captured:", window.ErrorReportService.lastError);
    };

    window.addEventListener("unhandledrejection", function(event) {
      window.ErrorReportService.lastError = {
        message: event.reason ? (event.reason.message || event.reason) : "Unhandled Promise Rejection",
        stack: event.reason && event.reason.stack ? event.reason.stack : "",
        time: new Date().toISOString()
      };
      console.warn("Unhandled promise rejection captured:", window.ErrorReportService.lastError);
    });
  },

  // إرسال تقرير الخطأ إلى فايربيز
  sendReport: async function(reportData) {
    if (!window.db) throw new Error("قاعدة البيانات غير متصلة");
    var docId = "err_" + Date.now();
    var payload = Object.assign({}, reportData, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      status: "open" // 'open' or 'resolved'
    });
    return window.db.collection("error_reports").doc(docId).set(payload);
  }
};

// Module: utils/helpers.js
// دوال مساعدة عامة للتعامل مع التخزين المحلي، روابط جوجل درايف، وتنسيق الوقت
window.APP_UTILS = {
  // استخراج المعرف المباشر من رابط جوجل درايف
  extractDriveId: function(url) {
    if (!url) return "";
    var match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    match = url.match(/id=([a-zA-Z0-9_-]+)/);
    if (match && match[1]) return match[1];
    return url.trim();
  },

  // تحويل رابط جوجل درايف إلى رابط تشغيل وتضمين مباشر
  getDrivePreviewUrl: function(driveIdOrUrl) {
    var id = window.APP_UTILS.extractDriveId(driveIdOrUrl);
    if (!id) return "";
    return "https://drive.google.com/file/d/" + id + "/preview";
  },

  // تحويل رابط جوجل درايف إلى رابط صورة مباشر لعرض الأغلفة
  getDriveImageUrl: function(driveIdOrUrl) {
    if (!driveIdOrUrl) return "";
    var str = String(driveIdOrUrl).trim();
    if (!str || str.startsWith("data:") || str.startsWith("blob:")) return str;
    var id = window.APP_UTILS.extractDriveId(str);
    if (id && id.length >= 15 && !id.startsWith("http")) {
      return "https://drive.google.com/thumbnail?id=" + id + "&sz=w800";
    }
    return str;
  },

  // تنسيق الثواني إلى دقائق وثوانٍ
  formatDuration: function(seconds) {
    if (!seconds || isNaN(seconds)) return "00:00";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  },

  // حفظ واسترجاع من التخزين المحلي
  getLocal: function(key, defaultValue) {
    try {
      var item = localStorage.getItem(key);
      return item ? JSON.parse(item) : defaultValue;
    } catch (e) {
      return defaultValue;
    }
  },

  setLocal: function(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  },

  // تخزين الملفات الكبيرة (PDFs) بدون إنترنت عبر IndexedDB
  openOfflineDb: function() {
    return new Promise(function(resolve, reject) {
      if (!("indexedDB" in window)) {
        reject(new Error("IndexedDB غير مدعوم"));
        return;
      }
      var req = indexedDB.open("counsel_offline_storage", 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("books_pdf")) {
          db.createObjectStore("books_pdf", { keyPath: "bookId" });
        }
      };
      req.onsuccess = function(e) { resolve(e.target.result); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  },

  saveOfflinePdf: async function(bookId, blobData) {
    try {
      var db = await window.APP_UTILS.openOfflineDb();
      return new Promise(function(resolve, reject) {
        var tx = db.transaction("books_pdf", "readwrite");
        var store = tx.objectStore("books_pdf");
        var req = store.put({ bookId: bookId, data: blobData, savedAt: Date.now() });
        req.onsuccess = function() { resolve(true); };
        req.onerror = function(e) { reject(e.target.error); };
      });
    } catch (e) {
      console.warn("Offline save failed:", e);
      return false;
    }
  },

  getOfflinePdf: async function(bookId) {
    try {
      var db = await window.APP_UTILS.openOfflineDb();
      return new Promise(function(resolve, reject) {
        var tx = db.transaction("books_pdf", "readonly");
        var store = tx.objectStore("books_pdf");
        var req = store.get(bookId);
        req.onsuccess = function(e) {
          if (e.target.result && e.target.result.data) {
            resolve(e.target.result.data);
          } else {
            resolve(null);
          }
        };
        req.onerror = function() { resolve(null); };
      });
    } catch (e) {
      return null;
    }
  },

  removeOfflinePdf: async function(bookId) {
    try {
      var db = await window.APP_UTILS.openOfflineDb();
      return new Promise(function(resolve, reject) {
        var tx = db.transaction("books_pdf", "readwrite");
        var store = tx.objectStore("books_pdf");
        var req = store.delete(bookId);
        req.onsuccess = function() { resolve(true); };
        req.onerror = function() { resolve(false); };
      });
    } catch (e) {
      return false;
    }
  }
};

// Module: utils/embedHelpers.js
// دالة استخراج وتضمين يوتيوب أو جوجل درايف
window.APP_UTILS.getMediaEmbedUrl = function(url) {
  if (!url) return "";
  // فحص يوتيوب
  var ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
  if (ytMatch && ytMatch[1]) {
    return "https://www.youtube.com/embed/" + ytMatch[1];
  }
  // فحص جوجل درايف
  var driveId = window.APP_UTILS.extractDriveId(url);
  if (driveId) {
    return "https://drive.google.com/file/d/" + driveId + "/preview";
  }
  return url;
};

// تحويل رابط جوجل درايف أو الملفات لرابط تشغيل صوتي مباشر بمشغل HTML5 Audio
window.APP_UTILS.getAudioStreamUrl = function(url) {
  if (!url) return "";
  var driveId = window.APP_UTILS.extractDriveId(url);
  if (driveId) {
    return "/api/audio-proxy?id=" + driveId;
  }
  return url;
};

// نافذة تسجيل الدخول وطلب الانضمام للمنصة
window.AuthModal = function(props) {
  var isOpen = props.isOpen;
  var onClose = props.onClose;
  var onLoginSuccess = props.onLoginSuccess;

  var [isLogin, setIsLogin] = React.useState(true);
  var [email, setEmail] = React.useState("");
  var [phone, setPhone] = React.useState("");
  var [fullName, setFullName] = React.useState("");
  var [instituteMessage, setInstituteMessage] = React.useState("");
  var [isLoading, setIsLoading] = React.useState(false);
  var [pendingNotice, setPendingNotice] = React.useState(false);
  var [errorMsg, setErrorMsg] = React.useState("");

  if (!isOpen) return null;

  var handleRegisterRequest = async function(e) {
    e.preventDefault();
    setIsLoading(true);
    setErrorMsg("");

    try {
      if (!window.db) throw new Error("قاعدة البيانات غير متصلة");

      // فحص الحساب المسؤول الافتراضي
      if (email.trim().toLowerCase().includes("admin") || email.trim().toLowerCase().includes("nader") || phone.trim() === "01275571569") {
        onLoginSuccess({
          fullName: "الأدمن المسؤول",
          email: email.trim(),
          phone: phone.trim(),
          role: "admin",
          status: "approved"
        });
        onClose();
        return;
      }

      var userDocId = "user_" + phone.trim().replace(/\D/g, "");
      var userData = {
        fullName: fullName.trim(),
        email: email.trim().toLowerCase(),
        phone: phone.trim(),
        instituteMessage: instituteMessage.trim(),
        role: "student",
        status: "pending", // قيد انتظار موافقة الأدمن
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await window.db.collection("users").doc(userDocId).set(userData, { merge: true });
      setPendingNotice(true);
    } catch (err) {
      setErrorMsg(err.message || "حدث خطأ أثناء إرسال الطلب");
    } finally {
      setIsLoading(false);
    }
  };

  var handleLogin = async function(e) {
    e.preventDefault();
    setIsLoading(true);
    setErrorMsg("");

    try {
      // فحص إذا كان حساب الأدمن
      if (email.trim().toLowerCase().includes("admin") || email.trim().toLowerCase().includes("nader") || phone.trim() === "01275571569") {
        onLoginSuccess({
          fullName: "الأدمن المسؤول",
          email: email.trim(),
          phone: phone.trim(),
          role: "admin",
          status: "approved"
        });
        onClose();
        return;
      }

      if (!window.db) throw new Error("قاعدة البيانات غير متصلة");

      // البحث عن المستخدم بالهاتف أو البريد
      var snap = await window.db.collection("users").where("email", "==", email.trim().toLowerCase()).get();
      if (snap.empty) {
        snap = await window.db.collection("users").where("phone", "==", phone.trim()).get();
      }

      if (snap.empty) {
        throw new Error("لا يوجد حساب مسجل بهذه البيانات. يرجى تقديم طلب انضمام أولاً.");
      }

      var user = snap.docs[0].data();
      if (user.status !== "approved") {
        throw new Error("طلب انضمامك قيد المراجعة لدى الأدمن. ستتمكن من الدخول فور الموافقة عليك.");
      }

      onLoginSuccess(user);
      onClose();
    } catch (err) {
      setErrorMsg(err.message);
    } finally {
      setIsLoading(false);
    }
  };

  return React.createElement(
    "div",
    { className: "fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" },
    React.createElement(
      "div",
      { className: "bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4" },

      React.createElement(
        "div",
        { className: "flex items-center justify-between border-b pb-3" },
        React.createElement("div", null,
          React.createElement("h3", { className: "text-base font-bold text-slate-900 dark:text-white" },
            isLogin ? "تسجيل الدخول للمنصة" : "طلب انضمام دارس جديد"
          ),
          React.createElement("p", { className: "text-xs text-slate-400" }, "منصة دراسة المشورة • حساب خاص بالدارسين")
        ),
        React.createElement("button", { onClick: onClose, className: "text-slate-400" }, "✕")
      ),

      errorMsg && React.createElement(
        "div",
        { className: "p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 text-xs border border-rose-200" },
        errorMsg
      ),

      pendingNotice ? React.createElement(
        "div",
        { className: "p-6 text-center space-y-3" },
        React.createElement("div", { className: "text-3xl" }, "⏳"),
        React.createElement("h4", { className: "text-sm font-bold text-slate-900 dark:text-white" }, "تم استلام طلب انضمامك بنجاح"),
        React.createElement("p", { className: "text-xs text-slate-500 leading-relaxed" },
          "الطلب الآن في انتظار مراجعة الأدمن للتأكد من بيانات الدارسين. ستتمكن من تصفح المحاضرات والمراجع فور تفعيل حسابك."
        ),
        React.createElement("button", {
          onClick: function() { setPendingNotice(false); setIsLogin(true); },
          className: "mt-2 bg-slate-900 dark:bg-emerald-600 text-white px-5 py-2 rounded-xl text-xs font-bold"
        }, "العودة لتسجيل الدخول")
      ) : isLogin ? React.createElement(
        // نموذج تسجيل الدخول
        "form",
        { onSubmit: handleLogin, className: "space-y-3" },
        React.createElement("div", null,
          React.createElement("label", { className: "block text-xs font-semibold mb-1" }, "البريد الإلكتروني"),
          React.createElement("input", {

          })
        ),
        React.createElement("button", {
          type: "submit",

// Module: App.js
// المكون الرئيسي App.js مع دمج نظام التقاط وبلاغات الأعطال
function App() {
  var utils = window.APP_UTILS;
  var cfg = window.APP_CONFIG;

  var [activeTab, setActiveTab] = React.useState(function() {
    var hash = (window.location.hash || "").replace("#", "").trim();
    var saved = utils.getLocal("counsel_active_tab");
    var validTabs = ["lectures", "books", "curriculum", "notes", "tasks", "summary_podcast", "users_admin", "error_reports", "settings"];
    if (hash && validTabs.indexOf(hash) !== -1) return hash;
    if (saved && validTabs.indexOf(saved) !== -1) return saved;
    return "lectures";
  });

  React.useEffect(function() {
    utils.setLocal("counsel_active_tab", activeTab);
    if (window.location.hash !== "#" + activeTab) {
      try {
        history.replaceState(null, "", "#" + activeTab);
      } catch (e) {
        window.location.hash = activeTab;
      }
    }
  }, [activeTab]);

  React.useEffect(function() {
    var handleHash = function() {
      var h = (window.location.hash || "").replace("#", "").trim();
      if (h && h !== activeTab) {
        setActiveTab(h);
      }
    };
    window.addEventListener("hashchange", handleHash);
    return function() { window.removeEventListener("hashchange", handleHash); };
  }, [activeTab]);
  var [isSidebarOpen, setIsSidebarOpen] = React.useState(false);
  var [isAuthOpen, setIsAuthOpen] = React.useState(false);
  var [isErrorReportOpen, setIsErrorReportOpen] = React.useState(false);

  var [isInstallPromptOpen, setIsInstallPromptOpen] = React.useState(false);
  var [deferredPrompt, setDeferredPrompt] = React.useState(null);
  var [hasNotificationPermission, setHasNotificationPermission] = React.useState(function() {
    return ("Notification" in window) && Notification.permission === "granted";
  });

  var [hasUpdateAvailable, setHasUpdateAvailable] = React.useState(false);

  // مراقبة توفر تحديث جديد للمنصة فوراً عند كل رفع
  React.useEffect(function() {
    var checkAppUpdate = async function() {
      try {
        var base = window.location.href.split("#")[0].split("?")[0];
        var response = await fetch(base + "?t=" + Date.now(), {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
        });
        if (response.ok) {
          var htmlText = await response.text();
          var match = htmlText.match(/version:\s*"([^"]+)"/);
          var bTimeMatch = htmlText.match(/buildTime:\s*"([^"]+)"/);
          if (match && match[1] && match[1] !== cfg.version) {
            setHasUpdateAvailable(true);
          } else if (bTimeMatch && bTimeMatch[1] && bTimeMatch[1] !== cfg.buildTime) {
            setHasUpdateAvailable(true);
          }
        }
      } catch (e) {}
    };

    var interval = setInterval(checkAppUpdate, 5000);
    checkAppUpdate();

    var onFocus = function() { checkAppUpdate(); };
    window.addEventListener("focus", onFocus);
    window.addEventListener("visibilitychange", onFocus);

    return function() {
      clearInterval(interval);
      window.removeEventListener("focus", onFocus);
      window.removeEventListener("visibilitychange", onFocus);
    };
  }, []);

  // التقاط حدث تثبيت التطبيق PWA
  React.useEffect(function() {
    var handleBeforeInstall = function(e) {
      e.preventDefault();
      setDeferredPrompt(e);
    };
    window.addEventListener("beforeinstallprompt", handleBeforeInstall);

    // الاستماع للإشعارات الواردة
    var unsubscribeNotifs = function() {};
    if (window.NotificationService && typeof window.NotificationService.subscribeNotifications === "function") {
      var initialLoad = true;
      unsubscribeNotifs = window.NotificationService.subscribeNotifications(function(list) {
        if (!initialLoad && list.length > 0) {
          var latest = list[0];
          if ("Notification" in window && Notification.permission === "granted") {
            try {
              new Notification(latest.title, {
                body: latest.body,
                icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E🌿%3C/text%3E%3C/svg%3E"
              });
            } catch (err) {}
          }
        }
        initialLoad = false;
      });
    }

    return function() {
      window.removeEventListener("beforeinstallprompt", handleBeforeInstall);
      if (typeof unsubscribeNotifs === "function") unsubscribeNotifs();
    };
  }, []);

  var handleToggleNotification = async function() {
    if (window.NotificationService && typeof window.NotificationService.requestPermission === "function") {
      var granted = await window.NotificationService.requestPermission();
      setHasNotificationPermission(granted);
    }
  };

  var [currentUser, setCurrentUser] = React.useState(function() {
    return utils.getLocal("counsel_current_user", {
      fullName: "الأدمن",
      email: "eng.nader.reda@gmail.com",
      phone: "01275571569",
      role: "admin",
      status: "approved"
    });
  });

  var [theme, setTheme] = React.useState(function() {
    return utils.getLocal(cfg.storageKeys.theme, "light");
  });

  React.useEffect(function() {
    if (theme === "dark") {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
    utils.setLocal(cfg.storageKeys.theme, theme);
  }, [theme]);

  var handleToggleTheme = function() {
    setTheme(theme === "dark" ? "light" : "dark");
  };

  var handleLoginSuccess = function(userData) {
    setCurrentUser(userData);
    utils.setLocal("counsel_current_user", userData);
    alert("مرحباً بك يا " + (userData.fullName || "زميلنا العزيز") + "! تم تسجيل الدخول بنجاح.");
  };

  return React.createElement(
    "div",
    { className: "min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col font-cairo" },

    React.createElement(window.Sidebar, {
      activeTab: activeTab,
      onTabChange: setActiveTab,
      currentUser: currentUser,
      onOpenAuth: function() { setIsAuthOpen(true); },
      isOpen: isSidebarOpen,
      onClose: function() { setIsSidebarOpen(false); },
      hasNotificationPermission: hasNotificationPermission,
      onToggleNotification: handleToggleNotification,
      onOpenInstallPrompt: function() { setIsInstallPromptOpen(true); },
      onOpenErrorReport: function() { setIsErrorReportOpen(true); }
    }),

    React.createElement(
      "div",
      { className: "flex-1 flex flex-col min-w-0 transition-all duration-300 w-full" },

      // شريط الترويسة العلوية مع شريط التحديث معاً في رأس ثابت مثبت في أعلى الشاشة دائماً (fixed)
      React.createElement(
        "div",
        { className: "fixed top-0 inset-x-0 z-50 flex flex-col w-full shadow-md bg-white dark:bg-slate-900" },
        
        // شريط التنبيه بوجود تحديث جديد
        hasUpdateAvailable && React.createElement(
          "div",
          {
            className: "bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-white px-3 sm:px-6 py-2 text-xs sm:text-sm font-bold flex items-center justify-between shadow-md border-b border-orange-600/80 animate-pulse"
          },
          React.createElement(
            "div",
            { className: "flex items-center gap-2 min-w-0" },
            React.createElement("span", { className: "text-base sm:text-lg shrink-0 animate-bounce" }, "🚀"),
            React.createElement("span", { className: "truncate sm:whitespace-normal font-bold drop-shadow-xs" }, "يتوفر تحديث جديد للمنصة الآن! اضغط لتطبيقه فوراً.")
          ),
          React.createElement(
            "button",
            {
              onClick: function() {
                if ("caches" in window) {
                  caches.keys().then(function(names) {
                    for (var i = 0; i < names.length; i++) caches.delete(names[i]);
                  });
                }
                window.location.reload(true);
              },
              className: "bg-white text-orange-600 hover:text-orange-700 px-3.5 py-1.5 rounded-xl text-xs font-black hover:bg-orange-50 shadow-md transition-all active:scale-95 whitespace-nowrap shrink-0 border border-orange-200"
            },
            "اضغط هنا للتحديث 🔄"
          )
        ),

        // ترويسة التطبيق الرئيسية
        React.createElement(window.Header, {
          isSidebarOpen: isSidebarOpen,
          onOpenSidebar: function() { setIsSidebarOpen(function(prev) { return !prev; }); },
          theme: theme,
          onToggleTheme: handleToggleTheme,
          currentUser: currentUser,
          onOpenErrorReport: function() { setIsErrorReportOpen(true); },
          hasNotificationPermission: hasNotificationPermission,
          onToggleNotification: handleToggleNotification,
          onOpenInstallPrompt: function() { setIsInstallPromptOpen(true); }
        })
      ),

      React.createElement(
        "main",
        { className: "flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 md:px-8 py-5 pb-20 md:pb-8 " + (hasUpdateAvailable ? "pt-28 sm:pt-32" : "pt-20 sm:pt-22") },
        activeTab === "lectures" && React.createElement(window.LecturesPage, { currentUser: currentUser }),
        activeTab === "books" && React.createElement(window.BooksPage, { currentUser: currentUser }),
        activeTab === "curriculum" && React.createElement(window.CurriculumPage, { currentUser: currentUser }),
        activeTab === "notes" && React.createElement(window.NotesPage, { currentUser: currentUser }),
        activeTab === "users" && React.createElement(window.UsersManagementPage, { currentUser: currentUser }),
        activeTab === "errors" && React.createElement(window.ErrorReportsAdminPage, { currentUser: currentUser }),
        activeTab === "settings" && React.createElement(window.SettingsPage, { currentUser: currentUser })
      )
    ),

    React.createElement(window.BottomNav, {
      activeTab: activeTab,
      onTabChange: setActiveTab,
      onToggleSidebar: function() { setIsSidebarOpen(function(prev) { return !prev; }); }
    }),

    React.createElement(window.AuthModal, {
      isOpen: isAuthOpen,
      onClose: function() { setIsAuthOpen(false); },
      onLoginSuccess: handleLoginSuccess
    }),

    React.createElement(window.ErrorReporterModal, {
      isOpen: isErrorReportOpen,
      onClose: function() { setIsErrorReportOpen(false); },
      currentUser: currentUser,
      activeTab: activeTab
    }),

    React.createElement(window.InstallPromptModal, {
      isOpen: isInstallPromptOpen,
      onClose: function() { setIsInstallPromptOpen(false); },
      deferredPrompt: deferredPrompt,
      onInstalled: function() {
        setDeferredPrompt(null);
        alert("تهانينا! تم تثبيت تطبيق منصة المشورة بنجاح على جهازك.");
      }
    })
  );
}

ReactDOM.render(React.createElement(App, null), document.getElementById("root"));
