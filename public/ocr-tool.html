<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة استخراج نصوص الكتب</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); }
        h1 { font-size: 1.4rem; color: #1e293b; margin-top: 0; }
        p { color: #64748b; font-size: 0.85rem; line-height: 1.5; }
        label { display: block; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; color: #334155; }
        input[type="file"], input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        input[type="text"] { font-family: monospace; text-align: left; direction: ltr; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .btn-start { background: #0284c7; color: white; }
        .btn-start:hover { background: #0369a1; }
        .btn-stop { background: #ef4444; color: white; display: none; }
        .btn-stop:hover { background: #dc2626; }
        .btn-download { background: #10b981; color: white; display: none; width: 100%; margin-top: 12px; }
        .btn-download:hover { background: #059669; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #progress-container { display: none; margin-top: 15px; padding: 15px; background: #f1f5f9; border-radius: 12px; border: 1px solid #e2e8f0; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-top: 10px; }
        .metric-card { background: white; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .metric-val { font-size: 1.1rem; font-weight: bold; color: #0284c7; }
        .metric-lbl { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
        .progress-bar { height: 10px; background: #cbd5e1; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s ease; }
        #status { font-weight: bold; font-size: 0.9rem; color: #1e293b; text-align: center; }
        #log { margin-top: 15px; padding: 10px; background: #0f172a; border-radius: 10px; font-size: 0.8rem; color: #94a3b8; height: 140px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
        .preview-box { margin-top: 15px; padding: 12px; background: #fffbeb; border: 1px solid #fef3c7; border-radius: 10px; font-size: 0.85rem; color: #92400e; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 أداة استخراج النصوص الذكية</h1>
    <p>تقرأ ملفات الكتب المصورة صفحة بصفحة وتستخرج النص العربي الأصلي بدقة 100% بدون أي تلخيص مع حساب الوقت وإمكانية الإيقاف والتحميل الفوري.</p>

    <label for="apiKey">مفتاح جوجل:</label>
    <input type="text" id="apiKey" placeholder="ضع المفتاح هنا..." />

    <label for="pdfFile">اختر ملف الكتاب (PDF):</label>
    <input type="file" id="pdfFile" accept="application/pdf" />

    <div style="margin-bottom: 12px; display: flex; items-center; gap: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 0.85rem; color: #475569; cursor: pointer;">
            <input type="checkbox" id="includePageHeaders" style="width: auto; margin-bottom: 0;" />
            تضمين عبارة "الصفحة رقم كذا" داخل النص (غير محبذ للكتب الصوتية حتى لا يقطع السماع)
        </label>
    </div>    <div class="row">
        <div>
            <label for="startPage">من صفحة:</label>
            <input type="number" id="startPage" value="1" min="1" />
        </div>
        <div>
            <label for="endPage">إلى صفحة (اختياري للتجربة):</label>
            <input type="number" id="endPage" placeholder="اتركه فارغاً لكل الكتاب" min="1" />
        </div>
    </div>

    <div class="btn-group">
        <button id="startBtn" class="btn-start">🚀 بدء الاستخراج</button>
        <button id="stopBtn" class="btn-stop">⏹️ إيقاف وحفظ ما تم إنجازه</button>
    </div>

    <button id="downloadNowBtn" class="btn-download">📥 تحميل ملف النص المستخرج الآن (.txt)</button>

    <div id="progress-container">
        <div id="status">جاري التجهيز...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-val" id="percentVal">0%</div>
                <div class="metric-lbl">نسبة الإنجاز</div>
            </div>
            <div class="metric-card">
                <div class="metric-val" id="timeElapsedVal">00:00</div>
                <div class="metric-lbl">الوقت المستغرق</div>
            </div>
            <div class="metric-card">
                <div class="metric-val" id="timeRemainingVal">--:--</div>
                <div class="metric-lbl">الوقت المتوقع المتبقي</div>
            </div>
        </div>
    </div>

    <div id="previewBox" class="preview-box"></div>
    <div id="log"></div>
</div>

<script>
    const savedKey = localStorage.getItem('counsel_ai_api_key') || localStorage.getItem('COUNSEL_API_KEY') || localStorage.getItem('APP_CONFIG_API_KEY');
    if (savedKey) document.getElementById('apiKey').value = savedKey.replace(/"/g, '');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const logEl = document.getElementById('log');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadNowBtn = document.getElementById('downloadNowBtn');
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progressFill');
    const statusEl = document.getElementById('status');
    const percentVal = document.getElementById('percentVal');
    const timeElapsedVal = document.getElementById('timeElapsedVal');
    const timeRemainingVal = document.getElementById('timeRemainingVal');
    const previewBox = document.getElementById('previewBox');

    let isStopped = false;
    let accumulatedText = '';
    let timerInterval = null;
    let startTime = null;

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds) || seconds < 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    function log(msg) {
        logEl.textContent += msg + '\n';
        logEl.scrollTop = logEl.scrollHeight;
    }

    function triggerDownload() {
        if (!accumulatedText.trim()) return alert('لا يوجد نص مستخرج للتحميل بعد.');
        const blob = new Blob([accumulatedText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `كتاب_مستخرج_${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }

    downloadNowBtn.addEventListener('click', triggerDownload);

    stopBtn.addEventListener('click', () => {
        isStopped = true;
        stopBtn.disabled = true;
        statusEl.textContent = 'جاري إيقاف العملية وحفظ ما تم استخراجه...';
        log('تم طلب الإيقاف من المستخدم. سيتم إيقاف المعالجة فور انتهاء الصفحة الحالية.');
    });

    async function extractTextFromBase64(base64Image, apiKey) {
        const candidateModels = ["gemini-3-flash-preview", "gemini-3.1-flash-lite-preview"];
        let lastError = null;
        for (const m of candidateModels) {
            try {
                const url = "https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent?key=" + apiKey;
                const payload = {
                    contents: [{
                        parts: [
                            { text: "استخرج جميع النصوص العربية من هذه الصفحة بدقة متناهية 100% كما هي مكتوبة حرفياً وبدون أي تلخيص. ارجع النص فقط." },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }],
                    generationConfig: { temperature: 0.1 }
                };

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.status === 429) throw new Error('RATE_LIMIT');
                if (res.ok) {
                    const data = await res.json();
                    if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]) {
                        return data.candidates[0].content.parts[0].text;
                    }
                }
                lastError = new Error("API Error: " + res.status);
            } catch (err) {
                if (err.message === 'RATE_LIMIT') throw err;
                lastError = err;
            }
        }
        throw lastError || new Error("Failed to call API");
    }

    startBtn.addEventListener('click', async () => {
        const file = document.getElementById('pdfFile').files[0];
        const apiKey = document.getElementById('apiKey').value.trim();

        if (!file) return alert('الرجاء اختيار ملف الكتاب أولاً');
        if (!apiKey) return alert('الرجاء وضع مفتاح جوجل');

        isStopped = false;
        accumulatedText = '';
        startBtn.disabled = true;
        startBtn.style.display = 'none';
        stopBtn.disabled = false;
        stopBtn.style.display = 'block';
        downloadNowBtn.style.display = 'none';
        progressContainer.style.display = 'block';
        previewBox.style.display = 'none';
        logEl.textContent = '';
        
        try {
            log('جاري فتح ملف الكتاب وقراءة الصفحات...');
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            const pdfTotal = pdf.numPages;

            const fromPage = Math.max(1, parseInt(document.getElementById('startPage').value) || 1);
            let toPage = parseInt(document.getElementById('endPage').value) || pdfTotal;
            toPage = Math.min(pdfTotal, Math.max(fromPage, toPage));

            const totalToProcess = (toPage - fromPage) + 1;
            log(`تم فتح الكتاب. سيتم استخراج الصفحات من ${fromPage} إلى ${toPage} (إجمالي: ${totalToProcess} صفحة).`);

            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsedSec = (Date.now() - startTime) / 1000;
                timeElapsedVal.textContent = formatTime(elapsedSec);
            }, 1000);

            let completedCount = 0;

            for (let pageNum = fromPage; pageNum <= toPage; pageNum++) {
                if (isStopped) {
                    log('\nتم إيقاف المعالجة بناءً على طلبك.');
                    break;
                }

                statusEl.textContent = `جاري استخراج الصفحة ${pageNum} من ${toPage}...`;
                log(`\nمعالجة الصفحة ${pageNum}...`);

                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                
                const base64Full = canvas.toDataURL('image/jpeg', 0.8);
                const base64Data = base64Full.split(',')[1];

                let text = '';
                let success = false;
                let retries = 3;

                while (!success && retries > 0 && !isStopped) {
                    try {
                        text = await extractTextFromBase64(base64Data, apiKey);
                        success = true;
                        log(`✓ تم استخراج صفحة ${pageNum} بنجاح!`);
                    } catch (err) {
                        if (err.message === 'RATE_LIMIT') {
                            log(`تم الوصول للحد الأقصى مؤقتاً. انتظار 15 ثانية...`);
                            await new Promise(r => setTimeout(r, 15000));
                            retries--;
                        } else {
                            log(`خطأ في صفحة ${pageNum}: ${err.message}. إعادة المحاولة...`);
                            await new Promise(r => setTimeout(r, 5000));
                            retries--;
                        }
                    }
                }

                if (success) {
                                        const withHeader = document.getElementById('includePageHeaders').checked;
                    if (withHeader) {
                        accumulatedText += \n\n=== الصفحة ${pageNum} ===\n\n + text;
                    } else {
                        accumulatedText += (accumulatedText ? '\n\n' : '') + text;
                    }
                    previewBox.style.display = 'block';
                    previewBox.textContent = `آخر نص تم استخراجه (صفحة ${pageNum}): ` + text.substring(0, 150) + '...';
                } else if (!isStopped) {
                    accumulatedText += `\n\n=== الصفحة ${pageNum} ===\n\n(تعذر استخراج الصفحة)\n`;
                    log(`تجاوز الصفحة ${pageNum}.`);
                }

                completedCount++;
                const pct = Math.round((completedCount / totalToProcess) * 100);
                percentVal.textContent = pct + '%';
                progressFill.style.width = pct + '%';

                // Calculate estimated time remaining
                const elapsedSec = (Date.now() - startTime) / 1000;
                const avgSecPerPage = elapsedSec / completedCount;
                const remainingPages = totalToProcess - completedCount;
                const estRemainingSec = avgSecPerPage * remainingPages;
                timeRemainingVal.textContent = formatTime(estRemainingSec);

                // Show download button early if we have text
                if (accumulatedText.length > 0) {
                    downloadNowBtn.style.display = 'block';
                }

                if (pageNum < toPage && !isStopped) {
                    log('انتظار 3 ثوان لحماية الاتصال...');
                    await new Promise(r => setTimeout(r, 3000));
                }
            }

            clearInterval(timerInterval);
            statusEl.textContent = isStopped ? 'تم الإيقاف بنجاح!' : 'اكتمل الاستخراج بالكامل!';
            log('\nانتهت العملية. يمكنك الآن تحميل الملف النصي الناتج.');

            if (accumulatedText.trim().length > 0) {
                downloadNowBtn.style.display = 'block';
                triggerDownload();
            }

        } catch (error) {
            log(`حدث خطأ: ${error.message}`);
            statusEl.textContent = 'حدث خطأ أثناء المعالجة.';
            if (timerInterval) clearInterval(timerInterval);
        } finally {
            startBtn.style.display = 'block';
            startBtn.disabled = false;
            stopBtn.style.display = 'none';
        }
    });
</script>
</body>
</html>
