<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منصة دراسة المشورة والتعلم الذكي</title>
  <meta name="description" content="منصة دراسة المشورة الشخصية والتعلم الذكي">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- PWA Manifest & Mobile App Capabilities -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E🌿%3C/text%3E%3C/svg%3E">

  <!-- الخطوط العربية الراقية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- تنسيقات التصميم السريع (مع إخفاء تحذير الإنتاج) -->
  <script>
    const originalWarn = console.warn;
    console.warn = (...args) => {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
      originalWarn(...args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            tajawal: ['Tajawal', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- مكتبات الواجهة الأساسية (Google Hosted Libraries مع Fallback محلي نسبي) -->
  <script src="https://ajax.googleapis.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="./lib/react.production.min.js"><\/script>');
    }
  </script>
  <script src="https://ajax.googleapis.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
    if (!window.ReactDOM) {
      document.write('<script src="./lib/react-dom.production.min.js"><\/script>');
    }
  </script>

  <!-- مكتبات فايربيز السحابية المستقرة من خوادم جوجل الرسمية Gstatic -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

  <!-- مكتبة PDF.js الرسمية المدمجة للقراءة الأوفلاين وحفظ الصفحات -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <style>
    html, body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* شريط التمرير الواضح لسهولة السحب بالماوس أو اللمس */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(226, 232, 240, 0.6);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.7);
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* تحسينات تجربة المستخدم للهاتف المحمول (Mobile-First UI/UX Pro Max) */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* حماية مساحات اللمس لسهولة النقر بالإبهام (Minimum 44x44px target where needed) */
    button, a, input, select {
      touch-action: manipulation;
    }

    /* منع تحديد النصوص العشوائي أثناء التمرير في الموبايل */
    .no-select {
      -webkit-user-select: none;
      user-select: none;
    }

    /* شريط التنقل السفلي متوافق مع Home Indicator في iOS */
    .mobile-bottom-nav {
      padding-bottom: calc(0.5rem + var(--sab));
    }

    /* خطوط واضحة وقابلة للقراءة على الهاتف */
    @media (max-width: 640px) {
      body {
        font-size: 15px;
        line-height: 1.6;
      }
    }
  </style>
</head>

  <script>
